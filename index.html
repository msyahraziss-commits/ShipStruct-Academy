main{max-width:1050px;margin:auto;padding:25px 16px 110px}.ey{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--mint);font-weight:800}h1{font-size:clamp(24px,5vw,35px);line-height:1.18;margin:12px 0}h2{font-size:19px;margin:0 0 12px}h3{font-size:15px;margin:0 0 9px}p{line-height:1.75}small,.muted{color:var(--muted)}.intro{font-size:14px;color:#bfd2dc;max-width:640px}.hero{background:linear-gradient(135deg,#114457,#102b44);padding:26px;border:1px solid #366076;border-radius:19px;margin-bottom:20px;position:relative;overflow:hidden}.hero:after{content:'⚓';font-size:126px;position:absolute;right:20px;bottom:-30px;opacity:.09;pointer-events:none}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin:17px 0}.chip{font-size:11px;color:#b7d1da;background:#113346;border:1px solid #2a5468;border-radius:30px;padding:7px 11px}.chip b{color:var(--mint)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.card,.tile{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:18px;box-shadow:0 6px 22px #0002}.tile{display:block;text-align:left;color:var(--ink);width:100%}.tile:active{border-color:var(--mint)}.tile h3{margin:5px 0}.tile p{font-size:12px;color:var(--muted);margin:0}.num{font-size:11px;font-weight:800;color:var(--mint);letter-spacing:1px}.section{margin:29px 0 13px}.btn{background:var(--mint);border:1px solid var(--mint);border-radius:10px;padding:11px 15px;color:#06323c;font-weight:800;font-size:13px}.btn.alt{background:#15394b;border-color:#356173;color:var(--ink)}.btn:disabled{opacity:.45}.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.back{display:inline-block;color:var(--mint);margin-bottom:15px;font-size:12px;font-weight:800}
.lesson p,.lesson li{font-size:14px;line-height:1.82}.lesson ul{padding-left:22px}.lesson h2{margin-top:28px;color:#80eadb;font-size:18px}.note{padding:14px 17px;border-left:3px solid var(--mint);background:#153d4b;border-radius:8px;margin:15px 0;line-height:1.75}.score{font-size:42px;font-weight:900;color:var(--mint)}.answer{display:block;width:100%;background:#163749;border:1px solid #365668;border-radius:12px;padding:14px;color:#eaf7f7;text-align:left;font-size:13px;margin:9px 0}.answer.selected{border-color:var(--mint);background:#20525b}.answer.good{border-color:#66dbad}.answer.bad{border-color:#e59898}.result{border-radius:10px;background:#173e48;padding:15px;margin:12px 0;font-size:13px;line-height:1.7}.term{border-bottom:1px solid #2b4c5d;padding:11px 0;font-size:12px}.term strong{display:block;margin-bottom:4px;color:#fff}.tools{display:flex;gap:9px;margin:15px 0;flex-wrap:wrap}.tools input{background:#183a4b;color:#fff;border:1px solid #3e6473;padding:11px;border-radius:9px;min-width:0;max-width:100%}.tools label{font-size:12px;color:#c1d5da}.ship{width:100%;height:auto;border:1px solid #244e65;border-radius:12px;background:#092637;padding:12px}.ship [data-part]{cursor:pointer}.ship [data-part]:hover{filter:brightness(1.4)}.inspect{color:var(--muted);font-size:13px}.bar{background:#265063;height:9px;border-radius:8px;overflow:hidden;margin:12px 0}.fill{height:100%;background:var(--mint);border-radius:8px}.list{display:grid;gap:10px}.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:9;background:#071c2cf8;box-shadow:0 -5px 20px #0005;border-top:1px solid var(--edge);padding:6px 8px calc(7px + env(safe-area-inset-bottom));display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.tabbar a{font-size:10px;color:#a9c1cc;padding:11px 3px;text-align:center;border-radius:10px}.tabbar a.on{background:#17424c;color:var(--mint);font-weight:800}.disclaimer{color:#8ca5b1;font-size:11px;line-height:1.65;margin-top:35px}.sr{position:absolute;left:-9999px}
