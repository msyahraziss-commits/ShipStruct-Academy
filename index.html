  <title>ShipStruct Academy · Marine Engineering Cadet Learning</title>
</head>
<body>
  <div id="app"><div class="boot">SHIPSTRUCT<span>ACADEMY</span><small>Loading maritime learning platform…</small></div></div>
  <script>
/* Curated educational content. Illustrated arrangements are schematic, not class drawings. */
const MODULES = [
{id:1,title:'Ship Construction Fundamentals',subtitle:'Dimensions, displacement, materials',icon:'compass',color:'#3fd2be'},
{id:2,title:'Ship Structural Components',subtitle:'Hull, keel, double bottom, bulkheads',icon:'layers',color:'#58a6f3'},
{id:3,title:'Framing & Arrangements',subtitle:'Longitudinal and transverse framing',icon:'grid',color:'#f1b967'},
{id:4,title:'Hull Strength & Loading',subtitle:'Hogging, sagging, shear and stress',icon:'activity',color:'#d398f8'},
{id:5,title:'Watertight Integrity',subtitle:'Subdivision, hatch covers and doors',icon:'shield',color:'#48cad6'},
{id:6,title:'Stability Fundamentals',subtitle:'G, B, M and free surface',icon:'anchor',color:'#92bd85'},
{id:7,title:'Bulk Carrier Construction',subtitle:'Topside, hopper and cargo hold structure',icon:'ship',color:'#ed9d86'},
{id:8,title:'Tanker & Special Ship Types',subtitle:'Double hulls and cargo arrangements',icon:'droplet',color:'#c4b4fc'},
{id:9,title:'Engine Room Structure',subtitle:'Foundations, sea chests, shafting',icon:'settings',color:'#75c7e8'},
{id:10,title:'Surveys, Rules & Safety',subtitle:'Corrosion, classification and IMO',icon:'clipboard',color:'#f0c66c'}
];
const makeLesson=(id,module,title,minutes,objectives,overview,details,principle,aboard,defects,inspection,terms,summary)=>({id,module,title,minutes,objectives,overview,details,principle,aboard,defects,inspection,terms,summary});
const LESSONS=[
makeLesson('principal-dimensions',1,'Principal Dimensions of a Ship',12,
['Differentiate LOA, LBP, breadth, moulded depth and draught','Explain why correct reference points matter'],
'A ship is described using a small set of reference dimensions. Length overall (LOA) is its maximum overall length; length between perpendiculars (LBP) is a design reference length, commonly measured between the aft and forward perpendiculars. Breadth is measured across the hull, while depth is a vertical structural dimension and draught is the vertical distance from a reference baseline to the waterline.',
['Moulded dimensions are generally measured to the inside surface of shell plating at specified locations. Exact definitions depend on the naval architecture convention being used. Do not interchange extreme breadth with moulded breadth when computing coefficients.','Freeboard is the vertical distance from the assigned load-line deck reference to the relevant load line, measured according to the applicable Load Lines rules. It is not the same thing as moulded depth minus draught in every real arrangement.','In loading calculations, dimensions must be consistent with the vessel hydrostatic particulars. A small error in draught or water density can make a large difference to estimated displacement.'],
'Length and breadth influence resistance, seakeeping and available cargo space; depth and draught influence buoyancy and loading limits.',
'On a bulk carrier the engine cadet may see draught marks forward, midships and aft. Officers use corrected draughts with approved hydrostatic tables—not a casual tape-measure estimate—to assess loading.',
'Misreading draught marks, mixing units, or confusing LOA with LBP causes errors in voyage and hydrostatic estimates.',
'Use the vessel general arrangement, capacity plan, loading manual and hydrostatic tables; check which definitions and units are stated.',
['LOA','LBP','Moulded breadth','Moulded depth','Draught','Freeboard'],
'Dimensions are defined relative to agreed reference lines. Always confirm which length, breadth and draught a calculation requires.'),
makeLesson('displacement-tonnage',1,'Displacement, Deadweight & Tonnage',11,
['Distinguish mass displacement from deadweight','Separate cargo capacity from tonnage measurements'],
'Displacement is the mass of water displaced by the immersed hull; for a floating ship it equals the ship’s total mass. Deadweight (DWT) is the difference between loaded displacement and lightship displacement, representing carrying capacity for cargo, fuel, water, stores and other variable loads.',
['Gross tonnage (GT) and net tonnage (NT) are dimensionless regulatory measures derived from the volumes of enclosed spaces, not masses in tonnes. A ship with 45,000 GT does not necessarily displace 45,000 tonnes.','Lightship displacement includes the completed vessel with permanently fitted equipment but without consumables, variable loads or cargo as defined by the applicable lightship condition.','Seawater and freshwater have different densities. The same immersed volume corresponds to different displaced masses, so draft changes when moving between different water densities for the same ship mass.'],
'Archimedes’ principle: an afloat ship displaces water whose weight balances the vessel’s weight.',
'Ballast loading, bunkering and cargo operations alter displacement. Engine-room tanks contribute to the variable load and must be reflected correctly in ship records.',
'Confusing deadweight with cargo-only capacity or GT with displacement leads to incorrect explanations and capacity assumptions.',
'Read the loading booklet, stability information and tank sounding tables. Reconcile transfer records with the vessel’s approved loading information.',
['Displacement','Lightship','Deadweight','GT','NT','Density'],
'Displacement is a mass/weight concept; deadweight is carrying capacity; GT and NT are dimensionless volume-based measures.'),
makeLesson('keel-double-bottom',2,'Keel, Centre Girder & Double Bottom',15,
['Identify the outer bottom, inner bottom, floors and centre girder','Explain the double bottom’s strength and protective roles'],
'The double bottom is a structural space between outer bottom shell plating and the inner bottom (tank top). Floors and girders connect these plates into a strong cellular structure, resisting local pressure and transmitting hull loads.',
['The centre girder is a longitudinal structural member near the centreline; side girders support the inner bottom away from the centreline. Transverse floors support the panels and help distribute loads into longitudinal members.','The keel is traditionally the principal bottom centreline structural element; on modern welded ships the exact form differs from historical bar-keel construction. The structural keel should not be confused with the entire centre girder.','Double bottom spaces often form ballast, fuel or other tanks depending on ship design. Their tank boundaries, air pipes, sounding arrangements and manholes must be kept intact and maintained.'],
'A cellular bottom provides plate support and distributes loads while offering separation between the sea and inner bottom spaces.',
'On a bulk carrier, heavy cargo loads act on the tank top while external hydrostatic pressure acts on the shell. Both are transmitted through floors, girders and shell stiffeners.',
'Pitting, coating breakdown, damaged brackets, distorted floors, cracked weld toes and corrosion in poorly ventilated spaces are common inspection concerns.',
'Never enter double-bottom spaces without approved enclosed-space procedures. Review tank access plans and report wastage, deformation and suspicious leaks.',
['Keel','Centre girder','Side girder','Floor','Tank top','Outer bottom'],
'Think of the double bottom as interconnected plates, longitudinal girders and transverse floors—not simply an empty protective void.'),
makeLesson('shell-bulkheads',2,'Shell Plating, Frames & Bulkheads',14,
['Describe how shell plating is supported','Distinguish transverse and longitudinal bulkheads'],
'Shell plating forms the watertight outer skin. Frames and stiffeners prevent unsupported plates from deforming excessively under sea pressure and transfer local loads to the broader hull structure. Bulkheads divide the vessel into compartments and may carry significant structural loads.',
['Transverse bulkheads extend across the ship, assisting subdivision and transverse stiffness. Longitudinal bulkheads run fore-and-aft and can help resist longitudinal and transverse loads depending on arrangement.','Watertight bulkheads form part of the ship’s subdivision. Penetrations must preserve the required integrity using approved fittings and arrangements. Not every bulkhead is watertight.','Brackets, webs, stringers and stiffeners connect local plate panels with larger supporting members; transitions and cut-outs require careful structural detailing because stresses concentrate there.'],
'Load travels from a plate panel into its stiffeners, then into primary supporting members and the overall hull girder.',
'In a machinery space, bulkheads can separate engine room from tanks or steering gear spaces. A pipe passing through a watertight boundary requires suitable approved penetration details.',
'Fractures around openings, buckled plating, fractured brackets and local corrosion around weld connections reduce structural integrity.',
'Inspect for distortion, fractures, coating failures and leakage marks. Record location precisely with frame numbers and height reference when reporting.',
['Shell plating','Frame','Stiffener','Bulkhead','Bracket','Stringer'],
'Shell is the boundary; stiffeners support plates; bulkheads divide spaces and help the hull resist loads.'),
makeLesson('framing-arrangements',3,'Transverse vs Longitudinal Framing',15,
['Compare transverse and longitudinal framing','Explain combined framing used on large merchant vessels'],
'Transverse framing uses closely spaced athwartship frames as major recurring supports. Longitudinal framing places closely spaced fore-and-aft stiffeners with deeper transverse web frames at wider intervals. Real vessels often combine systems in different areas.',
['Longitudinal stiffeners increase the effectiveness of deck and bottom plating in resisting global hull girder longitudinal bending. Transverse frames provide good support for side shell and local loads.','A tanker may use extensive longitudinal framing in tanks; a bulk carrier may combine longitudinally stiffened decks and bottom with transverse arrangements in cargo hold sides, depending on the design and applicable rules.','Primary members such as deep webs and girders collect loads from ordinary stiffeners. Spacing and scantlings are selected by structural design; they are not interchangeable without an assessment.'],
'Longitudinal members contribute to sectional area resisting hull-girder bending; transverse members support transverse and localized forces.',
'In the hold, identify whether a vertical member is an ordinary frame or deep web frame. Inspect connections rather than assuming every stiffener is equally loaded.',
'Cracking at terminations and bracket toes, buckling between supports, and fractured connections can interrupt load paths.',
'Examine connection continuity, local distortion, erosion and corrosion in way of supports and cut-outs.',
['Transverse frame','Longitudinal stiffener','Web frame','Girder','Scantling'],
'Framing direction is a structural design choice; most modern merchant ships use a mixture tailored to hull stresses.'),
makeLesson('hull-bending',4,'Hogging, Sagging & Hull-Girder Stress',16,
['Explain hogging and sagging using buoyancy and weight','Relate bending to deck and bottom stresses'],
'Along a ship, weight and buoyancy are not uniformly distributed. Their imbalance produces shear force and bending moment. The entire hull behaves approximately like a beam, called the hull girder.',
['Hogging is a condition in which the hull bends with its midship region relatively higher than the ends. In positive hogging, the deck tends to be in tension and the bottom in compression.','Sagging is the opposite curvature: the middle is relatively lower than the ends; the deck tends toward compression and the bottom toward tension. Still-water cargo distribution and wave-induced buoyancy can both influence the bending state.','For a simplified section, bending stress is proportional to M·y/I. Real hull behavior involves fatigue, corrosion, torsion, panel buckling and dynamic loads, so simple beam equations are teaching models, not survey acceptance criteria.'],
'Net distributed load = weight per length − buoyancy per length (under a chosen sign convention). Integrating load gives shear; integrating shear gives bending moment.',
'Loading computer limits on a bulk carrier help the officer manage still-water shear and bending. Machinery officers should understand why tank transfers must be coordinated.',
'Loss of effective section by corrosion, local buckling in compressed regions, and cracking at high-stress discontinuities are concerns.',
'Use approved loading guidance. Report visible deck/shell deformation or abnormal structural cracking; do not independently approve loading arrangements.',
['Hull girder','Hogging','Sagging','Shear force','Bending moment','Section modulus'],
'Uneven buoyancy and weights bend the ship. Hogging and sagging reverse which extreme fibres are in tension and compression.'),
makeLesson('local-loads',4,'Panting, Pounding, Racking & Fatigue',13,
['Identify major local and cyclic hull loads','Explain why repeated small loads can matter'],
'Besides global bending, ships experience local and repeated loads. Panting is cyclic in-and-out movement of plating, often near the bow due to changing water pressures. Pounding or slamming occurs when hull sections impact water after emerging or encountering severe seas.',
['Racking is distortion of the transverse cross-section, especially important for ships with large deck openings. Torsion twists the hull about its length. Supporting structure is arranged to carry these effects.','Fatigue damage develops from repeated stress cycles, with cracks commonly initiating at weld toes, brackets, notches or sharp transitions. A load below the one-time failure strength may still produce fatigue damage over many cycles.','Corrosion worsens fatigue resistance and reduces effective thickness, making coating maintenance and inspection important. Slamming can create short-duration high local pressure.'],
'Where load changes rapidly or reverses direction, local structural details can govern durability even when average global stress is modest.',
'Engine room foundations also experience cyclic loading from vibration and ship motion. Keep an eye on loose equipment supports and reported cracks.',
'Cracked welds, local shell dents, fatigued brackets, buckling and coating damage can reveal repeated or unexpected loading.',
'Report cracks with photographs, precise location and approximate extent; arrange assessment by responsible officers and surveyors.',
['Panting','Pounding','Racking','Torsion','Fatigue'],
'Global bending is only one part of hull loading; local impacts and repeated stress cycles require sound detailing and inspection.'),
makeLesson('watertight',5,'Watertight Boundaries & Hatch Covers',15,
['Explain the distinction between watertight and weathertight','Recognize why closures and penetrations matter'],
'Watertight means preventing passage of water in a specified condition and pressure regime; weathertight generally refers to excluding water under the specified sea and weather conditions. These properties are not interchangeable.',
['Hatch covers protect cargo spaces from weather ingress; their cleats, seals, compression bars, drains and closing mechanisms must be properly maintained. A closure can look shut while sealing poorly.','Watertight doors, bulkhead penetrations, manhole covers and pipe/cable arrangements may form part of subdivision. Modifications can compromise integrity if not approved.','Freeing ports and drainage arrangements remove water shipped onto exposed decks. Blocked drainage increases the chance of water retention and additional loading.'],
'Maintaining a boundary prevents progressive flooding and limits damage consequences.',
'Before sailing, closure checks are coordinated under ship procedures. An engine cadet might monitor watertight engine-room access or bilge ingress alarms.',
'Worn rubber packing, damaged coamings, corrosion under sealing seats and unsecured access covers contribute to leaks.',
'Inspect seals, landing surfaces, drain channels and closing mechanisms under authorized procedures. Never bypass required closure arrangements.',
['Watertight','Weathertight','Hatch coaming','Compression bar','Gasket','Freeing port'],
'Understand what a boundary is designed to keep out and ensure closures are maintained and secured as required.'),
makeLesson('stability-centres',6,'Buoyancy, G, B, M & GM',15,
['Identify the centre of gravity and buoyancy','Interpret an initial metacentric height conceptually'],
'The centre of gravity (G) is the effective point through which the ship weight acts; the centre of buoyancy (B) is the centroid of the displaced underwater volume. The metacentre (M) is a geometric reference used for small-angle initial stability.',
['For an upright ship at small heel, transverse metacentric height GM = KM − KG. A positive initial GM usually indicates an initial righting tendency; a negative one suggests initial instability for the simple intact condition.','GM alone does not describe the entire righting-arm curve, range of positive stability or damage survivability. Approved stability criteria examine more than one value.','Adding a high weight generally raises KG and reduces GM; adding low ballast can lower KG but also brings free-surface and structural/load implications.'],
'The righting moment is approximately Δ·GZ, where Δ is displacement weight and GZ is the righting arm at the relevant heel.',
'Engineers report significant tank transfers; slack tank free surfaces and the impact on the stability condition must be considered by authorized officers.',
'Incorrect tank soundings or neglecting free-surface correction can overstate available stability.',
'Use an approved stability instrument and stability booklet. Educational examples are not substitutes for voyage calculations.',
['Centre of gravity','Centre of buoyancy','Metacentre','GM','GZ','KG','KM'],
'G and B are physical force reference points; M supports initial stability analysis. Positive initial GM is not the whole safety picture.'),
makeLesson('free-surface',6,'Free Surface Effect & Ballast Transfers',12,
['Explain why a slack tank reduces stability','Distinguish free surface from added weight'],
'When a partly filled tank is able to develop a moving free liquid surface, the liquid can shift toward the low side as the vessel heels. This increases the effective heeling effect and reduces initial stability.',
['Free-surface correction depends strongly on tank geometry, particularly transverse breadth, as well as liquid density and ship displacement. A wide slack tank can have a large impact.','Two extremes—completely full and effectively empty tanks—do not develop the same free surface as an intermediate slack tank, although other operational issues remain.','Cross-connected tanks, ballast transfers and tank division arrangements can change the effective free surface. Never assume that adding seawater ballast improves stability in every intermediate stage.'],
'Free-surface effects act as a virtual rise in G in the small-angle stability model; they do not literally mean solid weight moved upward.',
'When transferring ballast between double-bottom or wing tanks, engineers monitor level, pump alignment and communication with deck officers.',
'Unplanned open crossovers, misread levels and slack tanks can produce unexpected free-surface consequences.',
'Follow approved ballast procedures and stability loading computer instructions; report discrepancies and suspected leakage.',
['Free surface','Slack tank','Virtual rise of G','Tank moment of inertia'],
'It is the ability of liquid to shift across a free surface—not simply the presence of liquid—that reduces initial stability.'),
makeLesson('bulk-carrier-holds',7,'Bulk Carrier Cargo Hold Anatomy',16,
['Identify topside and hopper tanks','Explain how cargo and ballast loads travel into the hull'],
'A typical bulk carrier hold has a large central cargo space, sloping upper wing/topside tank boundaries near the deck, hopper side tanks at the lower sides, transverse bulkheads and a double bottom below the tank top.',
['Topside tanks are upper wing spaces commonly used for ballast and structural arrangement; hopper tanks form sloping lower side boundaries helping cargo flow and providing ballast or void space depending on design.','Cargo weight is carried by the tank top and adjacent structural supports. Heavy concentrated cargo and grab impact can damage the tank top if operational limits are disregarded.','Transverse corrugated or stiffened bulkheads separate cargo holds. Connections and stools transfer loads into the deck, side and bottom structures.'],
'Structural geometry supports both cargo handling and load transfer; sloping sides can reduce cargo trapping while forming stiff wing structures.',
'Inspect cargo hold coating and lower stool areas when safe and authorized. Engine cadets should understand ballast piping associated with wing and double-bottom spaces.',
'Corrosion in hold frames, damage from cargo gear, cracking at bracket toes and water leakage around hatch closures require attention.',
'Check cargo hold condition reports, coating damage, drainage, and approved close-up inspection requirements.',
['Topside tank','Hopper tank','Tank top','Cargo hold','Transverse bulkhead','Stool'],
'Bulker upper and lower wing structures support the hull and shape the cargo hold; ballast and cargo load paths meet at reinforced connections.'),
makeLesson('cargo-tank-load',7,'Tank Top Loading & Corrosion Hotspots',12,
['Recognize concentrated loading risks','Identify corrosion-prone structural details'],
'The inner bottom or tank top is a working cargo surface. Its plate thickness, supporting floors, girders and stiffeners are designed for specified loads and cannot safely be judged by appearance alone.',
['Cargo density and loading pattern matter. Heavy cargo near local support members creates different effects than the same mass uniformly distributed across a hold.','Coating breakdown, trapped moisture and deposits encourage corrosion. Small isolated pits and widespread general wastage have different assessment needs; both require measurement against approved limits.','Bracket toes, welds and connections near hopper ends can be fatigue-sensitive. Unauthorized welding or straightening is unacceptable for safety-critical structure.'],
'Structural resistance depends on plate span, support stiffness, material condition and the manner in which load is applied.',
'Engineers may find water or ballast leakage linked to tank boundary defects. Report and document, rather than assuming a leak is harmless.',
'Pitting, grooving, accelerated corrosion, dents, buckling and cracking compromise protective strength.',
'Use good lighting and authorized inspection access; never enter holds or tanks with an unapproved entry arrangement.',
['Tank top','Concentrated load','Pitting','Grooving','Wastage','Fatigue hotspot'],
'Cargo loading must respect approved limits and structural condition; loss of material or plate support reduces margin.'),
makeLesson('tanker-double-hull',8,'Double-Hull Tankers & Cofferdams',14,
['Explain double-hull tanker geometry','Recognize the purpose of cofferdams and cargo boundaries'],
'Double-hull tankers have an outer hull separated from the cargo tank boundary by wing and bottom spaces. This arrangement is intended to provide an additional layer between cargo and the sea in specified damage circumstances.',
['Longitudinal bulkheads and tank subdivision influence structural support, sloshing loads and cargo/ballast operations. Double-hull spaces may be ballast tanks or voids depending on arrangement.','A cofferdam is a separation space between certain tanks or spaces where segregation is needed. It must not be assumed safe for entry simply because it is nominally empty.','Tanker cargo spaces and associated systems introduce hazardous atmospheres and strict entry, cleaning, electrical and hot-work controls. Ship-specific arrangements govern all work.'],
'Tank boundaries form both protective barriers and load-carrying elements; damage to a member can affect integrity beyond the immediately visible space.',
'Engine-room personnel should understand the location of fuel and ballast boundaries and avoid unintended connections across segregated systems.',
'Corrosion, coating disbondment, leakage between spaces and cracked connection brackets are important concerns.',
'Observe atmosphere testing, permit-to-work and tanker-specific procedures; consult approved general arrangement and tank plans.',
['Double hull','Cofferdam','Wing tank','Longitudinal bulkhead','Segregation'],
'Tank boundaries provide structural and containment functions. Always verify actual arrangements from ship drawings.'),
makeLesson('engine-foundations',9,'Main Engine Foundations & Chocks',16,
['Trace main engine load transfer to the hull','Explain foundation seating, chocks and holding-down bolts'],
'A large marine diesel engine is seated on an engineered supporting structure built into the engine-room double bottom. Bedplate loads pass through chocks or seating arrangements and foundation structure into girders, floors and the rest of the hull.',
['Holding-down bolts and fitted bolts restrain the engine as intended by the machinery design; chocks provide controlled support and alignment. Different installations use steel or approved resin chocks.','The thrust bearing transmits propeller thrust into hull structure through the shafting foundation arrangement, either integrated with the engine or a separate thrust block.','Engine alignment can be affected by hull deflection, temperature, foundation condition and improper bolt tension. Maintenance follows maker procedures and ship alignment records.'],
'Foundations must sustain static weight, alternating machinery forces, torque reactions and thrust-related loads without losing alignment.',
'A Fourth Engineer may assist with foundation inspections, holding-down bolt checks and recording unusual vibration or fretting around machinery seatings.',
'Loose bolts, cracked chocks, fretting, foundation weld cracks and abnormal vibration are warning signs requiring engineering assessment.',
'Visual checks and specified tension/alignment checks should be planned under responsible engineers and manufacturer guidance.',
['Bedplate','Foundation girder','Chock','Holding-down bolt','Fretting','Thrust block'],
'An engine foundation is part of the hull load path, not simply a concrete-like pedestal beneath the engine.'),
makeLesson('sea-chests-bilge',9,'Sea Chests, Bilge Wells & Stern Structure',14,
['Understand why sea connections need careful structural integration','Locate bilge and stern-area construction features'],
'Sea chests are recessed hull structures housing seawater intake openings, grating and associated valves/strainers. Bilge wells are low points where water can collect for controlled removal through the relevant bilge system.',
['Sea inlet openings interrupt the shell and require appropriate reinforcement and valve arrangements. Ice, fouling and marine growth can impair seawater flow.','Stern tube and shaft support arrangements transfer shaft loads and maintain hull boundary integrity. They are integrated with stern frames and adjacent structure.','Bilge wells are designed with access, drainage and filtering arrangements appropriate to machinery spaces. Bilge systems have pollution-prevention controls; discharges must follow approved requirements.'],
'Openings and penetrations must preserve structural support and watertight integrity while allowing machinery services.',
'Engine cadets should trace sea chest suction routes, identify bilge wells, and understand alarms and safe isolation of sea connections.',

{id:'or03',module:2,level:'Foundation',question:'Describe the construction and functions of the double bottom on a bulk carrier.',model:['Identify outer shell, inner bottom (tank top), floors and longitudinal girders.','The structure distributes cargo and sea-pressure loads and supports bottom plating.','The space may be subdivided and used for ballast or other approved tank purposes.','It gives a protective separation between sea and inner-bottom spaces but is not a guarantee against flooding.'],followup:'Which structural members transmit the tank-top loading down toward the outer bottom?'},
{id:'or04',module:2,level:'Intermediate',question:'What is the purpose of a centre girder and how does it differ from transverse floors?',model:['The centre girder is a longitudinal bottom structural member near the centreline.','Transverse floors span across the double bottom at intervals and connect with girders and plating.','Together they support inner and outer bottom plating and transfer shear and local loads.','The specific scantlings and spacing depend on class-approved structural design.'],followup:'What inspection defects would you look for at a girder-to-floor connection?'},
{id:'or05',module:2,level:'Intermediate',question:'Explain the purpose of a collision bulkhead and the main safety concern with penetrations.',model:['The collision bulkhead is a forward watertight subdivision barrier intended to limit flooding following bow damage.','Its location and design are governed by applicable rules.','Any permitted penetration must meet the applicable watertight integrity requirements.','Unauthorised openings or leaking penetrations may defeat the intended subdivision.'],followup:'Which ship drawings would you consult to find the approved collision bulkhead?'},
{id:'or06',module:3,level:'Foundation',question:'Compare transverse and longitudinal framing systems.',model:['Transverse framing has relatively closely spaced transverse frames.','Longitudinal framing uses fore-and-aft stiffeners supported by deeper transverse web frames.','Longitudinals can contribute effectively to global longitudinal hull strength.','Modern vessels commonly combine arrangements by region to satisfy distinct load paths.'],followup:'Why might a tanker have many longitudinal members in its deck and bottom?'},
{id:'or07',module:3,level:'Advanced',question:'Trace the load path from external seawater pressure on shell plating into the hull structure.',model:['Hydrostatic and dynamic sea pressures act first on plating panels.','Plating passes loads to local stiffeners and frames.','These transfer forces to primary supports such as webs, stringers and bulkheads.','The load path continues into the overall hull structure; joints and brackets matter.'],followup:'Why may a missing bracket or fractured weld be important even if the plating is not perforated?'},
{id:'or08',module:4,level:'Foundation',question:'What is hogging and which parts of the hull girder tend to be in tension?',model:['Hogging is upward longitudinal curvature of the hull near midships relative to the ends.','A simple wave-crest-amidships example can create hogging conditions.','In a hogging bending condition, the main deck region tends toward tension.','Bottom structure tends toward compression; actual combined stresses depend on loads.'],followup:'How does the sign of hull-girder bending reverse during sagging?'},
{id:'or09',module:4,level:'Foundation',question:'Describe sagging and how a wave trough amidships can contribute to it.',model:['Sagging is downward longitudinal curvature near midships relative to the ends.','A trough amidships can reduce buoyancy support around midships relative to the ends.','The main deck region tends toward compression and bottom toward tension.','Cargo, ballast and still-water load distribution also affect the bending moment.'],followup:'Why must cargo/ballast distribution be considered together with wave conditions?'},
{id:'or10',module:4,level:'Intermediate',question:'Distinguish longitudinal bending, racking, panting and slamming.',model:['Longitudinal bending changes hull-girder curvature and creates sectional tension/compression.','Racking distorts a transverse cross-section under asymmetric and rolling loads.','Panting is cyclic in-and-out movement of plating particularly toward the ends.','Slamming is impulsive impact loading when hull surfaces strike water.'],followup:'Where would you expect additional strengthening for panting loads?'},
{id:'or11',module:5,level:'Foundation',question:'What is the difference between watertight and weathertight?',model:['Watertight is intended to prevent water passage under the applicable design pressure/conditions.','Weathertight is intended to resist entry of water in relevant sea and weather conditions.','A weathertight opening is not automatically watertight under hydrostatic head.','The exact requirements depend on opening position, design and rules.'],followup:'Give an example of each type of closure and explain inspection priorities.'},
{id:'or12',module:5,level:'Intermediate',question:'A hatch cover rubber seal is damaged before loading. What would you do as an engine cadet?',model:['Do not declare the hatch safe or operate beyond your authority.','Report the observed damage promptly to the responsible deck officer and relevant engineers.','Record location and observations without making unsupported repair decisions.','The responsible crew assess sealing, compression, drainage and applicable checks before loading.'],followup:'Why might blocked hatch coaming drains still cause water ingress with apparently good seals?'},
{id:'or13',module:6,level:'Foundation',question:'Define G, B and M in basic intact stability.',model:['G is the ship’s centre of gravity.','B is the centroid of the displaced underwater volume, the centre of buoyancy.','M is the initial metacentre associated with small-angle buoyancy shift.','Initial GM is the vertical distance between G and M, subject to corrections and conventions.'],followup:'Why does a positive initial GM not by itself prove complete stability compliance?'},
{id:'or14',module:6,level:'Intermediate',question:'Explain how slack ballast tanks affect initial stability.',model:['In a partly filled tank, liquid can shift sideways when the vessel heels.','The shift produces a free-surface effect that effectively reduces initial stability.','Corrected GM accounts for appropriate free-surface correction using approved methods.','Use approved loading/stability information; do not guess corrections from tank volume.'],followup:'Why can two tanks with equal liquid volumes have different free-surface effects?'},
{id:'or15',module:7,level:'Foundation',question:'Identify the hopper tank and topside tank of a bulk carrier and explain their structural purpose.',model:['Hopper side tanks occupy lower wing spaces along the cargo hold.','Topside tanks are upper wing spaces near the deck and hold side.','Their geometry influences cargo hold form and supports side/deck arrangements.','They can also form part of ballast arrangements according to vessel design.'],followup:'Which corners or connections might be vulnerable to fatigue or corrosion?'},
{id:'or16',module:7,level:'Intermediate',question:'Why must you monitor tank-top structural condition on a bulk carrier?',model:['The tank top carries heavy and sometimes concentrated cargo loads.','Loads pass through the inner bottom into floors, girders and shell structure.','Corrosion, buckling, cracking and tank-top damage can reduce effective strength.','Defects should be recorded and escalated for assessment by authorized personnel.'],followup:'What cargo loading documents and allowable loading guidance should be consulted?'},
{id:'or17',module:8,level:'Foundation',question:'Explain the basic structural idea of a double-hull oil tanker.',model:['A double-hull arrangement provides separation between cargo spaces and the outer shell at specified regions.','Longitudinal and transverse structures support the hull and compartment boundaries.','The double-side and double-bottom regions may form ballast or other spaces by design.','The arrangement does not remove the need for corrosion control, tank integrity and inspections.'],followup:'What is a cofferdam and when is it useful?'},
{id:'or18',module:8,level:'Intermediate',question:'How does container ship construction differ from a typical bulk carrier?',model:['Container ships typically have large open hatchways and need appropriately strengthened deck/side structures.','Container guides, cell guides or securing arrangements impose distinct local loads.','Bulk carriers instead emphasize hold boundaries and cargo/tank-top loading.','Actual structural arrangements differ between designs and class requirements.'],followup:'Why can large hatch openings create longitudinal strength and torsional challenges?'},
{id:'or19',module:9,level:'Foundation',question:'Describe how the main engine foundation transmits forces into the hull.',model:['The engine seating/foundation supports machinery weight and operation loads.','Chocks, holding-down arrangements and foundation girders transfer forces to primary ship structure.','The design must address thrust, alignment, vibration, thermal and dynamic behavior as applicable.','Cracks, loose fasteners or settlement require reporting and approved investigation.'],followup:'What symptoms might suggest a machinery foundation or holding-down problem?'},
{id:'or20',module:9,level:'Intermediate',question:'Why is the stern tube and shaft line arrangement important to hull construction?',model:['The shaft line runs from the propulsion plant to the propeller through supporting bearings/seals.','The stern tube connects the hull boundary with the shaft passage and helps provide sealing/support arrangements.','Hull deflection and shaft alignment interact; approved tolerances and arrangements are vessel-specific.','Leakage, bearing or seal concerns should be reported and managed under ship procedures.'],followup:'How may hull deformation affect shaft alignment?'},
{id:'or21',module:9,level:'Intermediate',question:'What is the function of a sea chest and what structural problems should an engineer watch for?',model:['The sea chest is a ship-side seawater intake box or recess with appropriate openings and fittings.','It serves sea-water systems while maintaining the integrity of its hull connections.','Marine growth, corrosion, leaks and damaged grills/valve connections warrant attention.','Isolation and internal inspections must follow approved shipboard procedures and safety controls.'],followup:'What risks arise if the sea chest isolation valve fails to seal?'},
{id:'or22',module:10,level:'Foundation',question:'What does a classification society surveyor check in a hull structural survey?',model:['The surveyor considers structural condition in accordance with the applicable class rules and survey scope.','Typical concerns include corrosion, cracking, deformation, repairs and compartment integrity.','Measurements, thickness gauging and close-up surveys may be specified by the survey program.','The onboard cadet should distinguish observations from authorized acceptance decisions.'],followup:'How would you prepare tank plans and defect locations for a survey?'},
{id:'or23',module:10,level:'Intermediate',question:'You observe a crack at an engine room structural bracket. What are your immediate priorities?',model:['Do not attempt unauthorized welding, chipping or temporary reinforcement.','Report promptly to the duty engineer/chief engineer with precise location and observations.','Maintain safe access; avoid entering or disturbing unsafe spaces.','Follow the responsible officer’s assessment, monitoring and approved corrective instructions.'],followup:'Why must a crack near an opening, weld toe or abrupt thickness change be examined carefully?'},
{id:'or24',module:10,level:'Advanced',question:'Why must you verify SOLAS, flag and classification requirements separately?',model:['SOLAS and other international instruments establish convention obligations.','Flag-state implementation and administration instructions can affect compliance pathways.','The classification society applies relevant class rules and approved plans.','Vessel type, build date, applicable amendments and exceptions matter; do not quote numbers from memory without checking.'],followup:'Which documents onboard would you consult before giving a specific structural requirement?'},
];

</script>

function icon(name,size=18){return `<svg class="icon" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true">${iconPaths[name]||iconPaths.grid}</svg>`}
const NAV=[['dashboard','home','Dashboard'],['academy','book','Learning Academy'],['explorer','ship','Interactive Ship'],['systems','layers','Structural Systems'],['quiz','target','Quiz & Exams'],['oral','question','Oral Exam Practice'],['inspections','shield','Inspection Lab'],['calculators','calc','Calculators'],['flashcards','cards','Flashcards'],['glossary','search','Glossary'],['resources','clipboard','References'],['progress','bar','My Progress'],['settings','settings','Settings']];

function getCurrentName(route){if(route.startsWith('lesson/'))return 'Lesson';if(route==='quiz')return 'Quiz & Exams';if(route.startsWith('inspection/'))return 'Inspection Lab';return NAV.find(x=>x[0]===route)?.[2]||'Dashboard'}
function sidebar(route){return `<aside class="sidebar ${ui.menu?'open':''}" id="sidebar"><a class="brand" href="#dashboard"><span class="brandmark">S</span><span><span class="brandname">SHIPSTRUCT<strong>ACADEMY</strong></span><span class="brandhint">MARINE LEARNING PLATFORM</span></span></a><div class="side-section">LEARNING SPACE</div><div class="nav">${NAV.map(([id,i,label],idx)=>`${idx===9?'<div class="side-section" style="padding-top:18px">TOOLS & ACCOUNT</div>':''}<a href="#${id}" class="nav-link ${(route===id||(route.startsWith('lesson/')&&id==='academy')||(route.startsWith('inspection/')&&id==='inspections'))?'active':''}">${icon(i)}<span>${label}</span></a>`).join('')}<a href="games.html" class="nav-link">${icon('target')}<span>Mini-games</span></a><a href="classroom.html" class="nav-link">${icon('book')}<span>Classroom</span></a><a href="notes.html" class="nav-link">${icon('book')}<span>Course notes</span></a></div><div class="side-bottom"><div class="side-tip"><div class="tip-emoji">⚓</div><h4>Make every watch count.</h4><p>Explore the structure beneath your feet — and prepare for your next oral exam.</p><button class="tip-btn" data-action="start-quick-quiz">Start practice quiz ${icon('arrow')}</button></div><div class="side-version">VERSION 1.1 · MOBILE-FRIENDLY MVP</div></div></aside>`}

function mobileTabs(route){const tabs=[['dashboard','home','Home'],['academy','book','Learn'],['explorer','ship','Explore'],['quiz','target','Quiz'],['more','menu','More']];const current=route.startsWith('lesson/')?'academy':route.startsWith('inspection/')?'more':route;return `<nav class="mobile-tabs" aria-label="Primary mobile navigation">${tabs.map(([id,ic,label])=>`<button type="button" class="mobile-tab ${current===id||(id==='more'&&(!tabs.some(x=>x[0]===current)||ui.menu))?'active':''}" ${id==='more'?'data-action="menu"':'data-action="goto" data-page="'+id+'"'} aria-label="${label}" ${current===id?'aria-current="page"':''}>${icon(ic,22)}<span>${label}</span></button>`).join('')}</nav>`}

function render(){const route=page();if(ui.menu&&window.innerWidth>950)ui.menu=false;document.body.classList.toggle('light',data.theme==='light');let view='';if(route==='dashboard')view=dashboard();else if(route==='academy')view=academy();else if(route.startsWith('lesson/'))view=lessonView(route.split('/')[1]);else if(route==='explorer')view=explorer();else if(route==='systems')view=systemsPage();else if(route==='oral')view=oralPage();else if(route==='quiz')view=quizPage();else if(route==='inspections')view=inspections();else if(route.startsWith('inspection/'))view=inspectionPage(route.split('/')[1]);else if(route==='calculators')view=calculators();else if(route==='flashcards')view=flashcards();else if(route==='glossary')view=glossary();else if(route==='resources')view=resources();else if(route==='progress')view=progress();else if(route==='settings')view=settings();else view=dashboard();el('app').innerHTML=`<div class="shell">${sidebar(route)}<div class="main">${header(route)}<main class="content">${view}${footer()}</main></div></div>${mobileTabs(route)}<div class="overlay ${ui.menu?'show':''}" data-action="close-menu"></div>`;if(route==='quiz'&&ui.quiz&&!ui.quiz.done)updateTimerUI()}
function shipHero(){return `<svg viewBox="0 0 610 290" aria-label="Stylized bulk carrier at sea" role="img"><defs><linearGradient id="shipgradient" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#3a7992"/><stop offset="1" stop-color="#183b59"/></linearGradient></defs><path d="M8 239 C150 215 310 254 602 225" fill="none" stroke="#6bd5d9" stroke-width="3" opacity=".45"/><path d="M38 173H582L528 246H119Z" fill="url(#shipgradient)" stroke="#8be4e6" stroke-width="3"/><path d="M54 181H574" stroke="#3ae1cb" stroke-width="6"/><path d="M68 168V143h62v25M151 168V139h62v29M232 168v-29h62v29M315 168v-29h62v29M399 168v-29h62v29" fill="#345e71" stroke="#a4c6d3" stroke-width="3"/><path d="M463 167v-78h78v78" fill="#c6dce3"/><path d="M474 89V65h60v24" fill="#f5f7f7"/><path d="M491 65V35h24v30" fill="#a6ccd3"/><path d="M476 100h56m-55 16h55m-55 16h55" stroke="#41687b" stroke-width="6" stroke-dasharray="12 8"/><path d="M96 202h427" stroke="#d7f8ff" stroke-width="1.4" stroke-dasharray="16 12" opacity=".45"/><path d="M0 253c120-15 225 13 320 0s184-14 290 0" stroke="#78d4db" stroke-width="5" fill="none" opacity=".65"/><path d="M0 272c120-13 225 15 320 0s184-12 290 0" stroke="#427c92" stroke-width="4" fill="none" opacity=".65"/></svg>`}

function hullStressDiagram(){const hog=ui.loadCase==='hogging';const deck=hog?'M75 112 Q350 58 625 112':'M75 80 Q350 136 625 80';const bottom=hog?'M75 160 Q350 106 625 160':'M75 130 Q350 187 625 130';const water=hog?'M0 188 Q350 92 700 188 L700 275 H0Z':'M0 152 Q350 236 700 152 L700 275 H0Z';return `<svg viewBox="0 0 700 275" role="img" aria-label="Schematic ${ui.loadCase} ship hull bending and wave conditions"><defs><linearGradient id="oceanShade" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1c8192" stop-opacity=".44"/><stop offset="1" stop-color="#071f34"/></linearGradient></defs><path d="${water}" fill="url(#oceanShade)" stroke="#40d8c7" stroke-width="3"/><path d="${deck}" fill="none" stroke="#73d8e9" stroke-width="13" stroke-linecap="round"/><path d="${bottom}" fill="none" stroke="#6f91bd" stroke-width="9" stroke-linecap="round"/>${[0,.125,.25,.375,.5,.625,.75,.875,1].map(t=>{const x=75+550*t;const deckY=hog?112-54*4*t*(1-t):80+56*4*t*(1-t);const bottomY=hog?160-54*4*t*(1-t):130+57*4*t*(1-t);return `<path d="M${x} ${deckY}V${bottomY}" stroke="#8bb9cb" stroke-width="3" opacity=".8"/>`}).join('')}<g font-family="system-ui,sans-serif" font-weight="700" font-size="16"><text x="350" y="29" fill="#e4fdff" text-anchor="middle">${hog?'HOGGING — CENTRE RISES':'SAGGING — CENTRE DROPS'}</text><text x="350" y="247" fill="#9bc5d1" text-anchor="middle">Simplified hull girder deformation · exaggerated for learning</text></g></svg>`}

, or issue a CoC grade.</p></div></div></div>`}const session=ui.oral;if(session.done){const good=session.responses.filter(x=>x.grade==='confident').length;return `${pageHeading('SESSION FINISHED','Oral Practice Debrief','Review your explanations, then repeat topics where you need more depth.')}<div class="card" style="max-width:850px;margin:0 auto"><span class="pill accent">${session.responses.length} questions completed</span><h2 style="font-size:30px">${good} confident / ${session.responses.length} responses</h2><p class="muted">Your result is a self-assessment, not an examination score.</p><div class="oral-debrief">${session.responses.map((r,i)=>{const q=ORAL_QUESTIONS.find(x=>x.id===r.id);return `<div class="review-item"><span class="pill ${r.grade==='confident'?'accent':'warning'}">${r.grade==='confident'?'Confident':'Revise'}</span><h4>${i+1}. ${safe(q.question)}</h4><p><strong>Your notes:</strong> ${safe(r.notes||'(Spoken response — no typed notes)')}</p><p><strong>Examiner follow-up:</strong> ${safe(q.followup)}</p></div>`}).join('')}</div><button class="btn" data-action="exit-oral">Start a new session ${icon('repeat')}</button></div>`}const q=ORAL_QUESTIONS.find(x=>x.id===session.ids[session.index]);const graded=Boolean(session.grade);return `${pageHeading('ORAL EXAM STATION','Chief Engineer’s Questions','One question at a time. Explain your reasoning clearly and consider likely follow-up questions.')}<div class="question-layout"><div class="quiz-progress"><span class="pill accent">Question ${session.index+1} / ${session.ids.length}</span><div class="progress-track"><div class="progress-fill" style="width:${pct(session.index,session.ids.length)}%"></div></div><span class="pill">${safe(q.level)}</span></div><div class="card quiz-panel"><span class="pill">MODULE ${q.module} · ${safe(moduleBy(q.module)?.title)}</span><h2>${safe(q.question)}</h2><div class="field"><label for="oral-answer">Your answer / revision notes (optional)</label><textarea id="oral-answer" class="textarea" placeholder="Explain the principle, the reason, and an example onboard...">${safe(ui.oralDraft)}</textarea></div>${!session.revealed?`<button class="btn" data-action="reveal-oral">Reveal examiner checkpoints ${icon('chevron')}</button>`:`<div class="examiner-points"><div class="eyebrow">EXAMINER CHECKPOINTS</div><ol>${q.model.map(t=>`<li>${safe(t)}</li>`).join('')}</ol><div class="followup"><strong>Follow-up question</strong><p>${safe(q.followup)}</p></div></div>${graded?`<div class="feedback"><strong>Response recorded: ${session.grade==='confident'?'Confident':'Needs revision'}</strong><p class="mini muted">You can revisit this subject in your learning record.</p></div><button class="btn" data-action="next-oral">${session.index===session.ids.length-1?'View debrief':'Next question'} ${icon('arrow',13)}</button>`:`<p class="muted mini" style="margin-top:16px">How well could you explain all the checkpoints?</p><div class="tab-row"><button class="btn secondary" data-action="grade-oral" data-value="revise">${icon('repeat',13)} Need revision</button><button class="btn" data-action="grade-oral" data-value="confident">${icon('check',13)} Confident</button></div>`}`}</div><div style="display:flex;justify-content:space-between;gap:12px;margin:16px 0"><button class="btn ghost small" data-action="exit-oral">Exit practice</button><span class="muted mini">Study aid · not a live examiner</span></div></div>`}
function quizPage(){if(ui.quiz)return ui.quiz.done?quizResult():quizRunning();return `${pageHeading('ASSESSMENT CENTRE','Quiz & Examinations','Build confidence with instructor-style practice questions and clear explanations. Study by module or attempt a full mixed assessment.')}<div class="quiz-start"><div class="card"><div class="card-header"><h3>Configure your practice</h3><span class="pill accent">${QUESTIONS.length} verified-format questions</span></div><div class="field"><label>Topic / module</label><select class="select" id="quiz-module"><option value="all">All ship construction topics</option>${MODULES.map(m=>`<option value="${m.id}" ${ui.quizModule===String(m.id)?'selected':''}>Module ${m.id} · ${safe(m.title)}</option>`).join('')}</select></div><div class="field"><label>Number of questions</label><select class="select" id="quiz-count">${[10,20,50].map(n=>`<option value="${n}" ${ui.quizCount===String(n)?'selected':''}>${n} questions</option>`).join('')}</select></div><div class="field"><label>Assessment mode</label><select class="select" id="quiz-timed"><option value="no" ${ui.quizTimed==='no'?'selected':''}>Practice · untimed</option><option value="yes" ${ui.quizTimed==='yes'?'selected':''}>Timed exam · 60 sec / question</option></select></div><button class="btn full" data-action="start-quiz">Begin assessment ${icon('arrow')}</button><p class="mini muted" style="margin-bottom:0;line-height:1.7">If a selected module has fewer questions than requested, the app uses all available questions in that module.</p></div><div class="card"><div class="eyebrow">EXAM PREPARATION</div><h2 style="font-size:24px;line-height:1.35;margin:14px 0">Train the way a good engineer thinks.</h2><p class="muted" style="line-height:1.9">Every response includes an explanation of the correct underlying principle. Revise topics where you miss questions and track improvement across attempts.</p><div style="margin-top:20px;display:grid;gap:14px"><div class="activity-item"><span class="stat-icon">${icon('target')}</span><div><strong>Knowledge recall</strong><div class="muted mini">Dimensions, construction and structural terms</div></div></div><div class="activity-item"><span class="stat-icon">${icon('shield')}</span><div><strong>Shipboard judgement</strong><div class="muted mini">What to report, inspect and verify</div></div></div><div class="activity-item"><span class="stat-icon">${icon('trophy')}</span><div><strong>Progress insight</strong><div class="muted mini">Results saved locally for later review</div></div></div></div></div></div><div class="section-head"><h2>Recent assessment results</h2><button class="link" data-action="goto" data-page="progress">View learning analytics →</button></div><div class="card flat">${data.history.length?data.history.slice(-5).reverse().map(h=>`<div class="activity-item"><span class="pill ${h.score>=70?'accent':'warning'}">${h.score}%</span><div style="flex:1"><h4>${h.correct}/${h.total} correct · ${safe(h.topic)}</h4><small>${new Date(h.date).toLocaleString()}</small></div></div>`).join(''):'<div class="empty">Your results will appear here after the first assessment.</div>'}</div>`}
function shuffle(array){const a=array.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function startQuiz(module,count,timed){if(interval)clearInterval(interval);const filtered=module==='all'?QUESTIONS:QUESTIONS.filter(q=>q.module===Number(module));const questions=shuffle(filtered).slice(0,Math.min(Number(count),filtered.length));if(!questions.length){notify('No questions found for this topic.');return}ui.quiz={items:questions,index:0,answers:{},seconds:timed?60*questions.length:null,done:false,topic:module==='all'?'All topics':moduleBy(module)?.title||'Topic',started:Date.now(),mode:timed?'Timed':'Practice'};if(timed){interval=setInterval(()=>{if(!ui.quiz||ui.quiz.done){clearInterval(interval);return}ui.quiz.seconds--;updateTimerUI();if(ui.quiz.seconds<=0)finishQuiz()},1000)}render();window.scrollTo(0,0)}
function updateTimerUI(){if(!ui.quiz||ui.quiz.seconds===null)return;const t=el('countdown');if(t)t.textContent=`${String(Math.floor(Math.max(0,ui.quiz.seconds)/60)).padStart(2,'0')}:${String(Math.max(0,ui.quiz.seconds)%60).padStart(2,'0')}`}
function quizRunning(){const quiz=ui.quiz,q=quiz.items[quiz.index],i=quiz.index,a=quiz.answers[i],answered=a!==undefined,finishedCount=Object.keys(quiz.answers).length;return `<div class="question-layout"><a class="backlink" href="#quiz" data-action="quit-quiz">← Exit assessment</a><div class="page-top"><div class="eyebrow">${safe(quiz.mode.toUpperCase())} · ${safe(quiz.topic)}</div><h1>Ship Construction Assessment</h1><div class="subtext">Think through the question before choosing your answer.</div></div><div class="quiz-progress"><span class="pill accent">Question ${i+1} of ${quiz.items.length}</span><div class="progress-track"><div class="progress-fill" style="width:${pct(i,quiz.items.length)}%"></div></div>${quiz.seconds!==null?`<span class="pill warning">${icon('clock',12)} <span id="countdown">--:--</span></span>`:''}</div><div class="card quiz-panel"><span class="pill">MODULE ${q.module} · ${safe(moduleBy(q.module)?.title)}</span><h2>${safe(q.q)}</h2><div class="choices">${q.options.map((opt,idx)=>`<button class="choice ${answered&&idx===q.answer?'correct':''} ${answered&&idx===a&&idx!==q.answer?'wrong':''}" data-action="answer" data-index="${idx}" ${answered?'disabled':''}><span class="letter">${String.fromCharCode(65+idx)}</span><span>${safe(opt)}</span>${answered&&idx===q.answer?`<span style="margin-left:auto;color:var(--accent)">${icon('check')}</span>`:''}</button>`).join('')}</div>${answered?`<div class="feedback ${a!==q.answer?'bad':''}"><strong>${a===q.answer?'✓ Correct answer':'Review this concept'}</strong><div style="margin-top:5px;font-size:12px">${safe(q.why)}</div></div>`:''}<div style="display:flex;align-items:center;justify-content:space-between;margin-top:22px;gap:12px"><span class="muted mini">${finishedCount} answered / ${quiz.items.length}</span><button class="btn" data-action="next-question" ${!answered?'disabled':''}>${i===quiz.items.length-1?'Finish assessment':'Next question'} ${icon('arrow')}</button></div></div><p class="muted mini" function finishQuiz(){if(!ui.quiz||ui.quiz.done)return;if(interval)clearInterval(interval);const q=ui.quiz;const correct=q.items.filter((item,i)=>q.answers[i]===item.answer).length;const score=pct(correct,q.items.length);q.correct=correct;q.score=score;q.done=true;data.history.push({date:new Date().toISOString(),score,correct,total:q.items.length,topic:q.topic,mode:q.mode});data.history=data.history.slice(-100);save();render()}

function inspections(){return `${pageHeading('PRACTICAL SIMULATION','Virtual Ship Inspection Lab','Work through realistic training scenarios. Make a decision at each stage and see why a response is appropriate.')}<div class="inspection-grid">${SCENARIOS.map((s,i)=>{const done=data.scenarios[s.id];return `<div class="card scenario-card"><span class="pill ${done?'accent':''}">SCENARIO ${String(i+1).padStart(2,'0')} · ${safe(s.difficulty)}</span><h3>${safe(s.label)}</h3><p>${safe(s.intro)}</p><div style="display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:13px"><span class="muted mini">${s.steps.length} decisions · ${safe(s.tag)}</span><button class="btn small" data-action="scenario" data-id="${s.id}">${done?'Repeat':'Start'} scenario ${icon('arrow',13)}</button></div></div>`}).join('')}</div><div class="note-block" style="margin-top:22px"><h4>${icon('shield',13)} Safety boundary</h4><p>These scenarios teach identification, reporting and basic engineering reasoning. They cannot replace command decisions, ship-specific drills, approved enclosed-space entry procedures or class inspection instructions.</p></div>`}

iv>${answered?`<div class="feedback ${x.choices[i]===step.answer?'':'bad'}"><strong>${x.choices[i]===step.answer?'Appropriate decision':'Consider this safer approach'}</strong><div style="margin-top:7px">${safe(step.why)}</div></div>`:''}<div style="display:flex;justify-content:flex-end;margin-top:17px"><button class="btn" data-action="scenario-next" ${!answered?'disabled':''}>${i===s.steps.length-1?'Finish scenario':'Continue inspection'} ${icon('arrow')}</button></div></div></div>`}
