function calculators(){const c=CALCS.find(x=>x.id===ui.calc)||CALCS[0];return `${pageHeading('PRACTICAL ENGINEERING','Naval Architecture Calculators','Learn the formula, enter realistic values, and examine each answer with its engineering assumptions.')}<div class="calc-grid"><div class="card"><div class="card-header"><h3>Choose calculator</h3></div><div class="calc-list">${CALCS.map(x=>`<button class="${x.id===c.id?'active':''}" data-action="calculator" data-id="${x.id}">${icon('calc')} ${safe(x.name)} ${x.id===c.id?icon('chevron'):''}</button>`).join('')}</div></div><div class="card"><span class="eyebrow">WORKED CALCULATION</span><h2 style="font-size:22px;margin:9px 0 20px">${safe(c.name)}</h2><div class="note-block" style="margin-top:0"><h4>Formula</h4><p style="color:var(--ink);font-size:19px;font-weight:700">${safe(c.formula)}</p></div><form id="calc-form" style="margin-top:22px"><div class="calc-inputs">${c.fields.map(([id,label,unit,defaultValue])=>`<div class="field"><label for="calc-${id}">${safe(label)} (${safe(unit)})</label><input class="number-field" type="number" min="0" step="any" required name="${id}" id="calc-${id}" value="${defaultValue}" style="width:100%"/></div>`).join('')}</div><button class="btn" type="submit" style="margin-top:9px">Calculate ${icon('arrow')}</button></form><div id="calc-out" class="calc-output"><small>READY FOR INPUT</small><strong>—</strong><small>Press Calculate to show the result and worked explanation.</small></div><div class="note-block"><h4>${icon('alert',13)} Assumptions & limitations</h4><p>${safe(c.note)}</p></div></div></div>`}
function glossary(){const matches=GLOSSARY.filter(([t,d])=>(t+' '+d).toLowerCase().includes(ui.glossarySearch.toLowerCase()));return `${pageHeading('YOUR REFERENCE DESK','Maritime Construction Glossary','Look up technical shipbuilding terms and revise their meaning before your next watch or oral examination.')}<div class="academy-controls"><input class="searchbox" id="glossary-search" placeholder="Search a maritime term or definition…" value="${safe(ui.glossarySearch)}" aria-label="Search glossary"/><span class="pill accent">${GLOSSARY.length} terms</span></div><div class="glossary-grid" id="glossary-results">${matches.map(([word,def])=>`<div class="card flat term" data-glossary-text="${safe((word+' '+def).toLowerCase())}"><h4>${safe(word)}</h4><p>${safe(def)}</p></div>`).join('')}</div>${matches.length?'':'<div class="empty">No matching glossary terms found.</div>'}`}
function flashcards(){const filtered=ui.flashModule==='all'?GLOSSARY:GLOSSARY.filter(([word])=>LESSONS.filter(l=>l.module===Number(ui.flashModule)).some(l=>l.terms.some(t=>t.toLowerCase()===word.toLowerCase())));const cards=filtered.length?filtered:GLOSSARY;const i=ui.flashIndex%cards.length,card=cards[i];const learned=data.flashKnown.includes(card[0]);return `${pageHeading('ACTIVE RECALL','Marine Engineering Flashcards','Flip a card to reveal its definition. Mark terms you know and keep working through unfamiliar vocabulary.')}<div style="max-width:740px;margin:0 auto"><div class="academy-controls"><select id="flash-module" class="select" aria-label="Flashcard topic"><option value="all">All technical terms</option>${MODULES.map(m=>`<option value="${m.id}" ${ui.flashModule===String(m.id)?'selected':''}>${safe(m.title)}</option>`).join('')}</select><span class="pill">Card ${i+1} of ${cards.length}</span><span class="pill accent">${data.flashKnown.length} known</span></div><div class="flashcard" tabindex="0" role="button" data-action="flip-flash" aria-label="Flip the flashcard"><span class="eyebrow">${ui.flashFlipped?'THE DEFINITION':'RECALL THE DEFINITION'}</span>${ui.flashFlipped?`<p>${safe(card[1])}</p>`:`<h2>${safe(card[0])}</h2>`}<span style="font-size:11px;color:#99c9ce">${icon('repeat',12)} TAP TO FLIP</span></div><div class="flash-controls"><button class="btn secondary" data-action="previous-flash">← Previous</button><button class="btn ${learned?'secondary':''}" data-action="known-flash">${learned?'✓ Known':'Mark as known'}</button><button class="btn secondary" data-action="next-flash">Next ${icon('arrow',13)}</button></div><div class="card flat" style="margin-top:23px"><h3>Revision strategy</h3><p class="muted mini">Try to explain the term aloud before flipping. Mark known cards to track familiarity; review again regularly. This MVP stores known terms, but does not yet implement an adaptive spaced-repetition scheduler.</p><div class="progress-row"><span>Known of all glossary terms</span><strong>${pct(data.flashKnown.length,GLOSSARY.length)}%</strong></div><div class="progress-track"><div class="progress-fill" style="width:${pct(data.flashKnown.length,GLOSSARY.length)}%"></div></div></div></div>`}
function resources(){return `${pageHeading('REFERENCE LIBRARY','Authoritative Maritime References','Open primary sources for the international regulatory framework. Use current and applicable vessel/class documents for precise requirements.')}<div class="grid-two"><div>${RESOURCES.map(x=>`<div class="card resource-card flat"><a href="${safe(x.url)}" target="_blank" rel="noopener noreferrer"><span class="eyebrow">${safe(x.org)}</span><h3>${safe(x.title)} ${icon('external',14)}</h3><p class="muted mini">${safe(x.desc)}</p></a></div>`).join('')}</div><aside><div class="card"><h3>Rules are vessel-specific</h3><p class="muted" style="font-size:12px">The correct criteria depend on the ship type, build date, dimensions, class, flag, amendments and its approved plans. This app intentionally does not invent scantling values, SOLAS regulation numbers or survey limits.</p><div class="note-block"><h4>Good onboard practice</h4><p>Ask to locate the vessel’s approved general arrangement, tank plans, stability booklet, loading manual, class certificates and relevant maintenance procedures.</p></div></div></aside></div>`}
function progress(){const attempts=count(data.history),avg=attempts?Math.round(data.history.reduce((s,h)=>s+h.score,0)/attempts):0,latest=data.history.at(-1);const complete=count(data.completed);const oralTotal=count(data.oralHistory);const oralRevise=(data.oralHistory||[]).filter(x=>x.grade==='revise').length;return `${pageHeading('YOUR LEARNING RECORD','Progress & Achievements','Follow completed lessons, examination results and inspection practice. All records are kept locally on this browser.')}<div class="stats" style="margin-bottom:22px"><div class="card stat"><span class="stat-icon">${icon('book')}</span><div><strong>${complete}/${LESSONS.length}</strong><small>Lessons completed</small></div></div><div class="card stat"><span class="stat-icon">${icon('trophy')}</span><div><strong>${avg||'—'}${attempts?'%':''}</strong><small>Average quiz score</small></div></div><div class="card stat"><span class="stat-icon">${icon('target')}</span><div><strong>${latest?latest.score+'%':'—'}</strong><small>Latest quiz result</small></div></div><div class="card stat"><span class="stat-icon">${icon('shield')}</span><div><strong>${Object.keys(data.scenarios).length}/${SCENARIOS.length}</strong><small>Scenarios completed</small></div></div></div><div class="note-block" style="margin:0 0 20px"><h4>Oral examination preparation</h4><p>${oralTotal} questions reviewed · ${oralRevise} marked for revision. <button class="link" data-action="goto" data-page="oral">Open oral practice →</button></p></div><div class="grid-two"><div class="card"><div class="card-header"><h3>Learning mastery by module</h3><span class="pill accent">${pct(complete,LESSONS.length)}% overall</span></div>${MODULES.map(m=>{const ls=LESSONS.filter(l=>l.module===m.id),finished=ls.filter(l=>lessonDone(l.id)).length,percent=pct(finished,ls.length);return `<div class="bar-row"><span>${safe(m.title)}</span><div class="progress-track"><div class="progress-fill" style="width:${percent}%"></div></div><strong>${percent}%</strong></div>`}).join('')}</div><div><div class="card"><div class="card-header"><h3>Latest exam results</h3></div>${data.history.length?data.history.slice(-7).reverse().map(h=>`<div class="activity-item"><span class="pill ${h.score>=70?'accent':'warning'}">${h.score}%</span><div><h4>${safe(h.topic)}</h4><small>${new Date(h.date).toLocaleDateString()} · ${h.correct}/${h.total} correct</small></div></div>`).join(''):'<div class="empty">No assessments yet.</div>'}<button class="btn secondary full" data-action="goto" data-page="quiz" style="margin-top:15px">Take another quiz</button></div><div class="card" style="margin-top:17px"><h3>Saved revision material</h3><p class="muted mini">${data.bookmarks.length} bookmarked lessons · ${Object.keys(data.notes).filter(k=>data.notes[k]?.trim()).length} lessons with notes · ${data.flashKnown.length} terms known</p>${data.bookmarks.length?data.bookmarks.map(id=>{const l=lessonBy(id);return l?`<div class="activity-item"><span class="activity-dot"></span><a class="link" href="#lesson/${id}">${safe(l.title)} →</a></div>`:''}).join(''):'<p class="muted mini">Bookmark a lesson to see it here.</p>'}</div></div></div><div class="section-head"><h2>Study history</h2><button class="link" data-action="goto" data-page="settings">Export progress →</button></div><div class="card flat"><p class="muted mini">Your study record remains on this device. Use Settings → Export to save a backup you can import on another device.</p></div>`}
function settings(){return `${pageHeading('YOUR WORKSPACE','App Settings','Manage appearance and local learning data. No sign-in or cloud sync is used in this guest-first version.')}${storageUnavailable?'<div class="note-block" role="status" style="margin-bottom:18px"><h4>Local saving is unavailable</h4><p>Export your study progress regularly. Your browser may erase in-session progress when you close this page.</p></div>':''}<div class="settings-grid"><div class="card"><div class="card-header"><h3>Appearance</h3>${icon('sun')}</div><p class="muted mini">Change between high-contrast maritime dark mode and clean light mode.</p><div style="display:flex;gap:9px"><button class="btn ${data.theme==='dark'?'':'secondary'}" data-action="set-theme" data-value="dark">${icon('moon')} Dark</button><button class="btn ${data.theme==='light'?'':'secondary'}" data-action="set-theme" data-value="light">${icon('sun')} Light</button></div></div><div class="card"><div class="card-header"><h3>Backup and restore</h3>${icon('download')}</div><p class="muted mini">Export your progress, bookmarks, exam history and notes to a JSON file.</p><button class="btn" data-action="export">${icon('download')} Export my progress</button><label for="import-file" class="mini muted" style="display:block;margin-top:15px">Import a previous ShipStruct progress file</label><input type="file" id="import-file" class="file-input" accept="application/json,.json"></div><div class="card"><h3>Privacy and account</h3><p class="muted mini">This MVP is designed for offline guest use. Study data remains in the browser’s local storage; it is not submitted to a server. Clearing site data can erase your study record.</p><span class="pill accent">Local learning profile</span><p class="muted mini" style="margin-top:15px">A future release can add secure student accounts and verified cloud synchronization.</p></div><div class="card"><h3>Reset learning record</h3><p class="muted mini">Clear completed lessons, quiz history, bookmarks, notes, scenarios and flashcard progress from this browser.</p><button class="btn danger" data-action="reset">Clear all local progress</button></div></div>`}
function applyFilters(inputId,itemAttr,selector){const term=(el(inputId)?.value||'').toLowerCase().trim();document.querySelectorAll(selector).forEach(item=>{item.style.display=(item.getAttribute(itemAttr)||'').includes(term)?'':'none'});if(inputId==='academy-search'){document.querySelectorAll('.module-section').forEach(section=>{section.style.display=[...section.querySelectorAll('.lesson-tile')].some(x=>x.style.display!=='none')?'':'none'})}}
function calculate(event){event.preventDefault();const calc=CALCS.find(c=>c.id===ui.calc);if(!calc)return;const values={};for(const [key,label] of calc.fields){const input=el('calc-'+key);if(!input||input.value.trim()===''){notify('Please enter '+label);return}values[key]=Number(input.value);if(!Number.isFinite(values[key])||(key!=='fsc'&&key!=='kg'&&key!=='km'&&values[key]<=0)){notify('Use a positive, valid number for '+label);return}}
 const r=calc.evaluate(values);if(!Number.isFinite(r.value)||!r.check){el('calc-out').innerHTML='<small>INPUT CHECK</small><strong style="font-size:19px;color:#ffccac">Review the values entered</strong><small>Check coefficient bounds, reference dimensions and signs.</small>';return}const rounded=Number(r.value.toPrecision(6));const note=(calc.id==='gm'?(r.value<=0?'<p class="mini" style="color:#ffdf9f">This example gives non-positive corrected initial GM. This is a simplified warning, not a complete stability assessment.</p>':'<p class="mini" style="color:#a9efdf">Positive corrected initial GM in this simplified example does not establish full compliance.</p>'):'');el('calc-out').innerHTML=`<small>CALCULATED RESULT</small><strong>${rounded.toLocaleString('en-US',{maximumFractionDigits:6})} <span style="font-size:15px">${safe(r.unit)}</span></strong><small>${safe(r.detail)}</small>${note}`}
function exportData(){const text=JSON.stringify({app:'ShipStruct Academy',version:1,exported:new Date().toISOString(),data},null,2),blob=new Blob([text],{type:'application/json'}),url=URL.createObjectURL(blob),anchor=document.createElement('a');anchor.href=url;anchor.download='ShipStruct_Academy_Progress.json';document.body.appendChild(anchor);anchor.click();anchor.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);notify('Progress exported as JSON.')} 
function importData(file){if(!file)return;if(file.size>5*1024*1024){notify('Progress file is too large.');return}const reader=new FileReader();reader.onload=()=>{try{const obj=JSON.parse(reader.result);if(obj.app!=='ShipStruct Academy'||!obj.data||!Array.isArray(obj.data.completed)||!Array.isArray(obj.data.history)||!Array.isArray(obj.data.bookmarks))throw Error('Invalid progress structure');if(!confirm('Replace this browser’s current progress with the imported backup?'))return;data={...structuredClone(DEFAULT),...obj.data};data.completed=data.completed.filter(id=>!!lessonBy(id));data.bookmarks=data.bookmarks.filter(id=>!!lessonBy(id));data.history=data.history.slice(-100);data.notes=Object.fromEntries(Object.entries(data.notes||{}).filter(([id,v])=>lessonBy(id)&&typeof v==='string').map(([id,v])=>[id,v.slice(0,10000)]));data.scenarios=(typeof data.scenarios==='object'&&!Array.isArray(data.scenarios)&&data.scenarios)||{};data.flashKnown=Array.isArray(data.flashKnown)?data.flashKnown:[];data.oralHistory=Array.isArray(data.oralHistory)?data.oralHistory.filter(r=>r&&typeof r==='object'&&ORAL_QUESTIONS.some(q=>q.id===r.id)&&['revise','confident'].includes(r.grade)).slice(-200).map(r=>({id:r.id,module:Number(r.module),grade:r.grade,notes:String(r.notes||'').slice(0,3000),date:String(r.date||'')})):[];data.visits=Array.isArray(data.visits)?data.visits:[];data.theme=['dark','light'].includes(data.theme)?data.theme:'dark';save();render();notify('Progress imported successfully.')}catch{notify('Could not read a valid ShipStruct progress file.')}};reader.readAsText(file)}
function handleAction(target){const action=target.dataset.action;if(!action)return;const id=target.dataset.id,index=Number(target.dataset.index);if(action==='goto'){go(target.dataset.page);return}if(action==='menu'){ui.menu=!ui.menu;render();return}if(action==='close-menu'){ui.menu=false;render();return}if(action==='global-search'){ui.glossarySearch='';go('glossary');setTimeout(()=>el('glossary-search')?.focus(),100);return}if(action==='theme'){data.theme=data.theme==='dark'?'light':'dark';save();render();return}if(action==='set-theme'){data.theme=target.dataset.value;save();render();return}if(action==='module'){ui.module=id;go('academy');return}if(action==='complete'){data.completed=data.completed.includes(id)?data.completed.filter(x=>x!==id):[...data.completed,id];save();render();notify(data.completed.includes(id)?'Lesson added to completed learning.':'Lesson marked incomplete.');return}if(action==='bookmark'){data.bookmarks=data.bookmarks.includes(id)?data.bookmarks.filter(x=>x!==id):[...data.bookmarks,id];save();render();notify(data.bookmarks.includes(id)?'Lesson bookmarked.':'Bookmark removed.');return}if(action==='save-note'){data.notes[id]=el('lesson-note')?.value||'';save();notify('Your study notes are saved locally.');return}if(action==='part'){ui.selectedPart=id;render();return}if(action==='toggle-labels'){ui.showLabels=!ui.showLabels;render();return}if(action==='start-quick-quiz'){ui.quiz=null;ui.quizModule='all';ui.quizCount='10';ui.quizTimed='no';startQuiz('all','10',false);go('quiz');return}if(action==='load-case'){ui.loadCase=target.dataset.value;render();return}if(action==='framing'){ui.framing=target.dataset.value;render();return}if(action==='start-oral'){ui.oralModule=el('oral-module').value;ui.oralCount=el('oral-count').value;const filtered=ORAL_QUESTIONS.filter(q=>ui.oralModule==='all'||q.module===Number(ui.oralModule));const ids=shuffle(filtered).slice(0,Math.min(Number(ui.oralCount),filtered.length)).map(q=>q.id);ui.oral={ids,index:0,revealed:false,grade:null,responses:[],done:false};ui.oralDraft='';render();return}if(action==='reveal-oral'){ui.oralDraft=el('oral-answer')?.value||'';ui.oral.revealed=true;render();return}if(action==='grade-oral'){if(!ui.oral||!ui.oral.revealed||ui.oral.grade)return;ui.oralDraft=el('oral-answer')?.value||ui.oralDraft;const question=ORAL_QUESTIONS.find(q=>q.id===ui.oral.ids[ui.oral.index]);const grade=target.dataset.value;ui.oral.grade=grade;const response={id:question.id,module:question.module,grade,notes:ui.oralDraft.slice(0,3000),date:new Date().toISOString()};ui.oral.responses.push(response);data.oralHistory.push(response);data.oralHistory=data.oralHistory.slice(-200);save();render();return}if(action==='next-oral'){if(!ui.oral?.grade)return;if(ui.oral.index>=ui.oral.ids.length-1)ui.oral.done=true;else ui.oral.index++;ui.oral.revealed=false;ui.oral.grade=null;ui.oralDraft='';render();window.scrollTo(0,0);return}if(action==='exit-oral'){ui.oral=null;ui.oralDraft='';render();return}if(action==='quiz-module'){ui.quiz=null;ui.quizModule=id;ui.quizCount='10';ui.quizTimed='no';go('quiz');return}if(action==='start-quiz'){const module=el('quiz-module').value,amount=el('quiz-count').value,timed=el('quiz-timed').value;ui.quizModule=module;ui.quizCount=amount;ui.quizTimed=timed;startQuiz(module,amount,timed==='yes');return}if(action==='answer'){if(!ui.quiz||ui.quiz.answers[ui.quiz.index]!==undefined)return;ui.quiz.answers[ui.quiz.index]=index;render();return}if(action==='next-question'){if(!ui.quiz||ui.quiz.answers[ui.quiz.index]===undefined)return;if(ui.quiz.index===ui.quiz.items.length-1)finishQuiz();else{ui.quiz.index++;render();window.scrollTo({top:0,behavior:'smooth'})}return}if(action==='quit-quiz'){if(interval)clearInterval(interval);ui.quiz=null;render();return}if(action==='retake-quiz'){const prior=ui.quiz;startQuiz(ui.quizModule,ui.quizCount,prior.mode==='Timed');return}if(action==='scenario'){ui.scenario={id,index:0,choices:{},done:false};go('inspection/'+id);return}if(action==='scenario-answer'){if(!ui.scenario||ui.scenario.choices[ui.scenario.index]!==undefined)return;ui.scenario.choices[ui.scenario.index]=index;render();return}if(action==='scenario-next'){const x=ui.scenario,s=SCENARIOS.find(k=>k.id===x?.id);if(!s||x.choices[x.index]===undefined)return;if(x.index>=s.steps.length-1){x.done=true;const correct=s.steps.filter((step,j)=>x.choices[j]===step.answer).length;data.scenarios[x.id]={date:new Date().toISOString(),score:pct(correct,s.steps.length)};save()}else x.index++;render();window.scrollTo({top:0,behavior:'smooth'});return}if(action==='reset-scenario'){ui.scenario={id,index:0,choices:{},done:false};render();return}if(action==='calculator'){ui.calc=id;render();return}if(action==='flip-flash'){ui.flashFlipped=!ui.flashFlipped;render();return}if(action==='next-flash'){ui.flashIndex++;ui.flashFlipped=false;render();return}if(action==='previous-flash'){ui.flashIndex=Math.max(0,ui.flashIndex-1);ui.flashFlipped=false;render();return}if(action==='known-flash'){const cards=filteredFlash(),word=cards[ui.flashIndex%cards.length][0];data.flashKnown=data.flashKnown.includes(word)?data.flashKnown.filter(x=>x!==word):[...data.flashKnown,word];save();render();return}if(action==='export'){exportData();return}if(action==='reset'){if(confirm('Delete all ShipStruct learning progress, notes and exam history from this browser? This cannot be undone unless you have exported a backup.')){data=structuredClone(DEFAULT);save();ui.quiz=null;render();notify('Local progress cleared.')}return}}
function filteredFlash(){if(ui.flashModule==='all')return GLOSSARY;const cards=GLOSSARY.filter(([word])=>LESSONS.filter(l=>l.module===Number(ui.flashModule)).some(l=>l.terms.some(t=>t.toLowerCase()===word.toLowerCase())));return cards.length?cards:GLOSSARY}
document.addEventListener('click',event=>{const target=event.target.closest('[data-action]');if(target){if(target.tagName==='A')event.preventDefault();handleAction(target)}});
document.addEventListener('submit',event=>{if(event.target.id==='calc-form')calculate(event)});
document.addEventListener('change',event=>{if(event.target.id==='module-filter'){ui.module=event.target.value;render()}if(event.target.id==='flash-module'){ui.flashModule=event.target.value;ui.flashIndex=0;ui.flashFlipped=false;render()}if(event.target.id==='import-file')importData(event.target.files[0])});
document.addEventListener('input',event=>{if(event.target.id==='oral-answer'){ui.oralDraft=event.target.value}if(event.target.id==='academy-search'){ui.academySearch=event.target.value;applyFilters('academy-search','data-search-text','.lesson-tile')}if(event.target.id==='glossary-search'){ui.glossarySearch=event.target.value;applyFilters('glossary-search','data-glossary-text','.term')}});
document.addEventListener('click',event=>{const part=event.target.closest('[data-part]');if(part){ui.selectedPart=part.dataset.part;render()}});
document.addEventListener('keydown',event=>{const part=event.target.closest('[data-part]');if(part&&(event.key==='Enter'||event.key===' ')){event.preventDefault();ui.selectedPart=part.dataset.part;render()}const card=event.target.closest('.flashcard');if(card&&(event.key==='Enter'||event.key===' ')){event.preventDefault();ui.flashFlipped=!ui.flashFlipped;render()}});
window.addEventListener('hashchange',()=>{ui.menu=false;render();window.scrollTo(0,0)});

markVisit();render();
})();

</script>
