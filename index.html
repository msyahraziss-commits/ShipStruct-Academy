</style></head><body><header class="top"><a href="#home" class="logo">⚓ SHIPSTRUCT <b>ACADEMY</b><small> · QUICK START</small></a><div class="flex"><a class="btn alt" href="classroom.html" style="font-size:12px;padding:9px 12px">🎓 Classroom</a><button onclick="location.hash='#glossary'">⌕ Glossary</button></div></header><main id="app"><section class="hero"><span class="ey">SHIPSTRUCT ACADEMY</span><h1>Study ship construction</h1><p class="intro">Your lessons are ready. Select a module to begin.</p><a class="btn" href="#module/1">Start studying →</a></section></main><nav class="tabbar" aria-label="Quick navigation"><a href="#home">⌂ Home</a><a href="#module/1">▤ Lessons</a><a href="#explorer">⚓ Explorer</a><a href="#quiz">◎ Quiz</a><a href="#inspections">♧ Inspect</a></nav><script type="application/json" id="content">{"modules":[{"id":1,"title":"Ship Construction Fundamentals","subtitle":"Dimensions, displacement, materials","icon":"compass","color":"#3fd2be"},{"id":2,"title":"Ship Structural Components","subtitle":"Hull, keel, double bottom, bulkheads","icon":"layers","color":"#58a6f3"},{"id":3,"title":"Framing & Arrangements","subtitle":"Longitudinal and transverse framing","icon":"grid","color":"#f1b967"},{"id":4,"title":"Hull Strength & Loading","subtitle":"Hogging, sagging, shear and stress","icon":"activity","color":"#d398f8"},{"id":5,"title":"Watertight Integrity","subtitle":"Subdivision, hatch covers and doors","icon":"shield","color":"#48cad6"},{"id":6,"title":"Stability Fundamentals","subtitle":"G, B, M and free surface","icon":"anchor","color":"#92bd85"},{"id":7,"title":"Bulk Carrier Construction","subtitle":"Topside, hopper and cargo hold structure","icon":"ship","color":"#ed9d86"},{"id":8,"title":"Tanker & Special Ship Types","subtitle":"Double hulls and cargo arrangements","icon":"droplet","color":"#c4b4fc"},{"id":9,"title":"Engine Room Structure","subtitle":"Foundations, sea chests, shafting","icon":"settings","color":"#75c7e8"},{"id":10,"title":"Surveys, Rules & Safety","subtitle":"Corrosion, classification and IMO","icon":"clipboard","color":"#f0c66c"}],"lessons":[{"id":"principal-dimensions","module":1,"title":"Principal Dimensions of a Ship","minutes":12,"objectives":["Differentiate LOA, LBP, breadth, moulded depth and draught","Explain why correct reference points matter"],"overview":"A ship is described using a small set of reference dimensions. Length overall (LOA) is its maximum overall length; length between perpendiculars (LBP) is a design reference length, commonly measured between the aft and forward perpendiculars. Breadth is measured across the hull, while depth is a vertical structural dimension and draught is the vertical distance from a reference baseline to the waterline.","details":["Moulded dimensions are generally measured to the inside surface of shell plating at specified locations. Exact definitions depend on the naval architecture convention being used. Do not interchange extreme breadth with moulded breadth when computing coefficients.","Freeboard is the vertical distance from the assigned load-line deck reference to the relevant load line, measured according to the applicable Load Lines rules. It is not the same thing as moulded depth minus draught in every real arrangement.","In loading calculations, dimensions must be consistent with the vessel hydrostatic particulars. A small error in draught or water density can make a large difference to estimated displacement."],"principle":"Length and breadth influence resistance, seakeeping and available cargo space; depth and draught influence buoyancy and loading limits.","aboard":"On a bulk carrier the engine cadet may see draught marks forward, midships and aft. Officers use corrected draughts with approved hydrostatic tables—not a casual tape-measure estimate—to assess loading.","defects":"Misreading draught marks, mixing units, or confusing LOA with LBP causes errors in voyage and hydrostatic estimates.","inspection":"Use the vessel general arrangement, capacity plan, loading manual and hydrostatic tables; check which definitions and units are stated.","terms":["LOA","LBP","Moulded breadth","Moulded depth","Draught","Freeboard"],"summary":"Dimensions are defined relative to agreed reference lines. Always confirm which length, breadth and draught a calculation requires."},{"id":"displacement-tonnage","module":1,"title":"Displacement, Deadweight & Tonnage","minutes":11,"objectives":["Distinguish mass displacement from deadweight","Separate cargo capacity from tonnage measurements"],"overview":"Displacement is the mass of water displaced by the immersed hull; for a floating ship it equals the ship’s total mass. Deadweight (DWT) is the difference between loaded displacement and lightship displacement, representing carrying capacity for cargo, fuel, water, stores and other variable loads.","details":["Gross tonnage (GT) and net tonnage (NT) are dimensionless regulatory measures derived from the volumes of enclosed spaces, not masses in tonnes. A ship with 45,000 GT does not necessarily displace 45,000 tonnes.","Lightship displacement includes the completed vessel with permanently fitted equipment but without consumables, variable loads or cargo as defined by the applicable lightship condition.","Seawater and freshwater have different densities. The same immersed volume corresponds to different displaced masses, so draft changes when moving between different water densities for the same ship mass."],"principle":"Archimedes’ principle: an afloat ship displaces water whose weight balances the vessel’s weight.","aboard":"Ballast loading, bunkering and cargo operations alter displacement. Engine-room tanks contribute to the variable load and must be reflected correctly in ship records.","defects":"Confusing deadweight with cargo-only capacity or GT with displacement leads to incorrect explanations and capacity assumptions.","inspection":"Read the loading booklet, stability information and tank sounding tables. Reconcile transfer records with the vessel’s approved loading information.","terms":["Displacement","Lightship","Deadweight","GT","NT","Density"],"summary":"Displacement is a mass/weight concept; deadweight is carrying capacity; GT and NT are dimensionless volume-based measures."},{"id":"keel-double-bottom","module":2,"title":"Keel, Centre Girder & Double Bottom","minutes":15,"objectives":["Identify the outer bottom, inner bottom, floors and centre girder","Explain the double bottom’s strength and protective roles"],"overview":"The double bottom is a structural space between outer bottom shell plating and the inner bottom (tank top). Floors and girders connect these plates into a strong cellular structure, resisting local pressure and transmitting hull loads.","details":["The centre girder is a longitudinal structural member near the centreline; side girders support the inner bottom away from the centreline. Transverse floors support the panels and help distribute loads into longitudinal members.","The keel is traditionally the principal bottom centreline structural element; on modern welded ships the exact form differs from historical bar-keel construction. The structural keel should not be confused with the entire centre girder.","Double bottom spaces often form ballast, fuel or other tanks depending on ship design. Their tank boundaries, air pipes, sounding arrangements and manholes must be kept intact and maintained."],"principle":"A cellular bottom provides plate support and distributes loads while offering separation between the sea and inner bottom spaces.","aboard":"On a bulk carrier, heavy cargo loads act on the tank top while external hydrostatic pressure acts on the shell. Both are transmitted through floors, girders and shell stiffeners.","defects":"Pitting, coating breakdown, damaged brackets, distorted floors, cracked weld toes and corrosion in poorly ventilated spaces are common inspection concerns.","inspection":"Never enter double-bottom spaces without approved enclosed-space procedures. Review tank access plans and report wastage, deformation and suspicious leaks.","terms":["Keel","Centre girder","Side girder","Floor","Tank top","Outer bottom"],"summary":"Think of the double bottom as interconnected plates, longitudinal girders and transverse floors—not simply an empty protective void."},{"id":"shell-bulkheads","module":2,"title":"Shell Plating, Frames & Bulkheads","minutes":14,"objectives":["Describe how shell plating is supported","Distinguish transverse and longitudinal bulkheads"],"overview":"Shell plating forms the watertight outer skin. Frames and stiffeners prevent unsupported plates from deforming excessively under sea pressure and transfer local loads to the broader hull structure. Bulkheads divide the vessel into compartments and may carry significant structural loads.","details":["Transverse bulkheads extend across the ship, assisting subdivision and transverse stiffness. Longitudinal bulkheads run fore-and-aft and can help resist longitudinal and transverse loads depending on arrangement.","Watertight bulkheads form part of the ship’s subdivision. Penetrations must preserve the required integrity using approved fittings and arrangements. Not every bulkhead is watertight.","Brackets, webs, stringers and stiffeners connect local plate panels with larger supporting members; transitions and cut-outs require careful structural detailing because stresses concentrate there."],"principle":"Load travels from a plate panel into its stiffeners, then into primary supporting members and the overall hull girder.","aboard":"In a machinery space, bulkheads can separate engine room from tanks or steering gear spaces. A pipe passing through a watertight boundary requires suitable approved penetration details.","defects":"Fractures around openings, buckled plating, fractured brackets and local corrosion around weld connections reduce structural integrity.","inspection":"Inspect for distortion, fractures, coating failures and leakage marks. Record location precisely with frame numbers and height reference when reporting.","terms":["Shell plating","Frame","Stiffener","Bulkhead","Bracket","Stringer"],"summary":"Shell is the boundary; stiffeners support plates; bulkheads divide spaces and help the hull resist loads."},{"id":"framing-arrangements","module":3,"title":"Transverse vs Longitudinal Framing","minutes":15,"objectives":["Compare transverse and longitudinal framing","Explain combined framing used on large merchant vessels"],"overview":"Transverse framing uses closely spaced athwartship frames as major recurring supports. Longitudinal framing places closely spaced fore-and-aft stiffeners with deeper transverse web frames at wider intervals. Real vessels often combine systems in different areas.","details":["Longitudinal stiffeners increase the effectiveness of deck and bottom plating in resisting global hull girder longitudinal bending. Transverse frames provide good support for side shell and local loads.","A tanker may use extensive longitudinal framing in tanks; a bulk carrier may combine longitudinally stiffened decks and bottom with transverse arrangements in cargo hold sides, depending on the design and applicable rules.","Primary members such as deep webs and girders collect loads from ordinary stiffeners. Spacing and scantlings are selected by structural design; they are not interchangeable without an assessment."],"principle":"Longitudinal members contribute to sectional area resisting hull-girder bending; transverse members support transverse and localized forces.","aboard":"In the hold, identify whether a vertical member is an ordinary frame or deep web frame. Inspect connections rather than assuming every stiffener is equally loaded.","defects":"Cracking at terminations and bracket toes, buckling between supports, and fractured connections can interrupt load paths.","inspection":"Examine connection continuity, local distortion, erosion and corrosion in way of supports and cut-outs.","terms":["Transverse frame","Longitudinal stiffener","Web frame","Girder","Scantling"],"summary":"Framing direction is a structural design choice; most modern merchant ships use a mixture tailored to hull stresses."},{"id":"hull-bending","module":4,"title":"Hogging, Sagging & Hull-Girder Stress","minutes":16,"objectives":["Explain hogging and sagging using buoyancy and weight","Relate bending to deck and bottom stresses"],"overview":"Along a ship, weight and buoyancy are not uniformly distributed. Their imbalance produces shear force and bending moment. The entire hull behaves approximately like a beam, called the hull girder.","details":["Hogging is a condition in which the hull bends with its midship region relatively higher than the ends. In positive hogging, the deck tends to be in tension and the bottom in compression.","Sagging is the opposite curvature: the middle is relatively lower than the ends; the deck tends toward compression and the bottom toward tension. Still-water cargo distribution and wave-induced buoyancy can both influence the bending state.","For a simplified section, bending stress is proportional to M·y/I. Real hull behavior involves fatigue, corrosion, torsion, panel buckling and dynamic loads, so simple beam equations are teaching models, not survey acceptance criteria."],"principle":"Net distributed load = weight per length − buoyancy per length (under a chosen sign convention). Integrating load gives shear; integrating shear gives bending moment.","aboard":"Loading computer limits on a bulk carrier help the officer manage still-water shear and bending. Machinery officers should understand why tank transfers must be coordinated.","defects":"Loss of effective section by corrosion, local buckling in compressed regions, and cracking at high-stress discontinuities are concerns.","inspection":"Use approved loading guidance. Report visible deck/shell deformation or abnormal structural cracking; do not independently approve loading arrangements.","terms":["Hull girder","Hogging","Sagging","Shear force","Bending moment","Section modulus"],"summary":"Uneven buoyancy and weights bend the ship. Hogging and sagging reverse which extreme fibres are in tension and compression."},{"id":"local-loads","module":4,"title":"Panting, Pounding, Racking & Fatigue","minutes":13,"objectives":["Identify major local and cyclic hull loads","Explain why repeated small loads can matter"],"overview":"Besides global bending, ships experience local and repeated loads. Panting is cyclic in-and-out movement of plating, often near the bow due to changing water pressures. Pounding or slamming occurs when hull sections impact water after emerging or encountering severe seas.","details":["Racking is distortion of the transverse cross-section, especially important for ships with large deck openings. Torsion twists the hull about its length. Supporting structure is arranged to carry these effects.","Fatigue damage develops from repeated stress cycles, with cracks commonly initiating at weld toes, brackets, notches or sharp transitions. A load below the one-time failure strength may still produce fatigue damage over many cycles.","Corrosion worsens fatigue resistance and reduces effective thickness, making coating maintenance and inspection important. Slamming can create short-duration high local pressure."],"principle":"Where load changes rapidly or reverses direction, local structural details can govern durability even when average global stress is modest.","aboard":"Engine room foundations also experience cyclic loading from vibration and ship motion. Keep an eye on loose equipment supports and reported cracks.","defects":"Cracked welds, local shell dents, fatigued brackets, buckling and coating damage can reveal repeated or unexpected loading.","inspection":"Report cracks with photographs, precise location and approximate extent; arrange assessment by responsible officers and surveyors.","terms":["Panting","Pounding","Racking","Torsion","Fatigue"],"summary":"Global bending is only one part of hull loading; local impacts and repeated stress cycles require sound detailing and inspection."},{"id":"watertight","module":5,"title":"Watertight Boundaries & Hatch Covers","minutes":15,"objectives":["Explain the distinction between watertight and weathertight","Recognize why closures and penetrations matter"],"overview":"Watertight means preventing passage of water in a specified condition and pressure regime; weathertight generally refers to excluding water under the specified sea and weather conditions. These properties are not interchangeable.","details":["Hatch covers protect cargo spaces from weather ingress; their cleats, seals, compression bars, drains and closing mechanisms must be properly maintained. A closure can look shut while sealing poorly.","Watertight doors, bulkhead penetrations, manhole covers and pipe/cable arrangements may form part of subdivision. Modifications can compromise integrity if not approved.","Freeing ports and drainage arrangements remove water shipped onto exposed decks. Blocked drainage increases the chance of water retention and additional loading."],"principle":"Maintaining a boundary prevents progressive flooding and limits damage consequences.","aboard":"Before sailing, closure checks are coordinated under ship procedures. An engine cadet might monitor watertight engine-room access or bilge ingress alarms.","defects":"Worn rubber packing, damaged coamings, corrosion under sealing seats and unsecured access covers contribute to leaks.","inspection":"Inspect seals, landing surfaces, drain channels and closing mechanisms under authorized procedures. Never bypass required closure arrangements.","terms":["Watertight","Weathertight","Hatch coaming","Compression bar","Gasket","Freeing port"],"summary":"Understand what a boundary is designed to keep out and ensure closures are maintained and secured as required."},{"id":"stability-centres","module":6,"title":"Buoyancy, G, B, M & GM","minutes":15,"objectives":["Identify the centre of gravity and buoyancy","Interpret an initial metacentric height conceptually"],"overview":"The centre of gravity (G) is the effective point through which the ship weight acts; the centre of buoyancy (B) is the centroid of the displaced underwater volume. The metacentre (M) is a geometric reference used for small-angle initial stability.","details":["For an upright ship at small heel, transverse metacentric height GM = KM − KG. A positive initial GM usually indicates an initial righting tendency; a negative one suggests initial instability for the simple intact condition.","GM alone does not describe the entire righting-arm curve, range of positive stability or damage survivability. Approved stability criteria examine more than one value.","Adding a high weight generally raises KG and reduces GM; adding low ballast can lower KG but also brings free-surface and structural/load implications."],"principle":"The righting moment is approximately Δ·GZ, where Δ is displacement weight and GZ is the righting arm at the relevant heel.","aboard":"Engineers report significant tank transfers; slack tank free surfaces and the impact on the stability condition must be considered by authorized officers.","defects":"Incorrect tank soundings or neglecting free-surface correction can overstate available stability.","inspection":"Use an approved stability instrument and stability booklet. Educational examples are not substitutes for voyage calculations.","terms":["Centre of gravity","Centre of buoyancy","Metacentre","GM","GZ","KG","KM"],"summary":"G and B are physical force reference points; M supports initial stability analysis. Positive initial GM is not the whole safety picture."},{"id":"free-surface","module":6,"title":"Free Surface Effect & Ballast Transfers","minutes":12,"objectives":["Explain why a slack tank reduces stability","Distinguish free surface from added weight"],"overview":"When a partly filled tank is able to develop a moving free liquid surface, the liquid can shift toward the low side as the vessel heels. This increases the effective heeling effect and reduces initial stability.","details":["Free-surface correction depends strongly on tank geometry, particularly transverse breadth, as well as liquid density and ship displacement. A wide slack tank can have a large impact.","Two extremes—completely full and effectively empty tanks—do not develop the same free surface as an intermediate slack tank, although other operational issues remain.","Cross-connected tanks, ballast transfers and tank division arrangements can change the effective free surface. Never assume that adding seawater ballast improves stability in every intermediate stage."],"principle":"Free-surface effects act as a virtual rise in G in the small-angle stability model; they do not literally mean solid weight moved upward.","aboard":"When transferring ballast between double-bottom or wing tanks, engineers monitor level, pump alignment and communication with deck officers.","defects":"Unplanned open crossovers, misread levels and slack tanks can produce unexpected free-surface consequences.","inspection":"Follow approved ballast procedures and stability loading computer instructions; report discrepancies and suspected leakage.","terms":["Free surface","Slack tank","Virtual rise of G","Tank moment of inertia"],"summary":"It is the ability of liquid to shift across a free surface—not simply the presence of liquid—that reduces initial stability."},{"id":"bulk-carrier-holds","module":7,"title":"Bulk Carrier Cargo Hold Anatomy","minutes":16,"objectives":["Identify topside and hopper tanks","Explain how cargo and ballast loads travel into the hull"],"overview":"A typical bulk carrier hold has a large central cargo space, sloping upper wing/topside tank boundaries near the deck, hopper side tanks at the lower sides, transverse bulkheads and a double bottom below the tank top.","details":["Topside tanks are upper wing spaces commonly used for ballast and structural arrangement; hopper tanks form sloping lower side boundaries helping cargo flow and providing ballast or void space depending on design.","Cargo weight is carried by the tank top and adjacent structural supports. Heavy concentrated cargo and grab impact can damage the tank top if operational limits are disregarded.","Transverse corrugated or stiffened bulkheads separate cargo holds. Connections and stools transfer loads into the deck, side and bottom structures."],"principle":"Structural geometry supports both cargo handling and load transfer; sloping sides can reduce cargo trapping while forming stiff wing structures.","aboard":"Inspect cargo hold coating and lower stool areas when safe and authorized. Engine cadets should understand ballast piping associated with wing and double-bottom spaces.","defects":"Corrosion in hold frames, damage from cargo gear, cracking at bracket toes and water leakage around hatch closures require attention.","inspection":"Check cargo hold condition reports, coating damage, drainage, and approved close-up inspection requirements.","terms":["Topside tank","Hopper tank","Tank top","Cargo hold","Transverse bulkhead","Stool"],"summary":"Bulker upper and lower wing structures support the hull and shape the cargo hold; ballast and cargo load paths meet at reinforced connections."},{"id":"cargo-tank-load","module":7,"title":"Tank Top Loading & Corrosion Hotspots","minutes":12,"objectives":["Recognize concentrated loading risks","Identify corrosion-prone structural details"],"overview":"The inner bottom or tank top is a working cargo surface. Its plate thickness, supporting floors, girders and stiffeners are designed for specified loads and cannot safely be judged by appearance alone.","details":["Cargo density and loading pattern matter. Heavy cargo near local support members creates different effects than the same mass uniformly distributed across a hold.","Coating breakdown, trapped moisture and deposits encourage corrosion. Small isolated pits and widespread general wastage have different assessment needs; both require measurement against approved limits.","Bracket toes, welds and connections near hopper ends can be fatigue-sensitive. Unauthorized welding or straightening is unacceptable for safety-critical structure."],"principle":"Structural resistance depends on plate span, support stiffness, material condition and the manner in which load is applied.","aboard":"Engineers may find water or ballast leakage linked to tank boundary defects. Report and document, rather than assuming a leak is harmless.","defects":"Pitting, grooving, accelerated corrosion, dents, buckling and cracking compromise protective strength.","inspection":"Use good lighting and authorized inspection access; never enter holds or tanks with an unapproved entry arrangement.","terms":["Tank top","Concentrated load","Pitting","Grooving","Wastage","Fatigue hotspot"],"summary":"Cargo loading must respect approved limits and structural condition; loss of material or plate support reduces margin."},{"id":"tanker-double-hull","module":8,"title":"Double-Hull Tankers & Cofferdams","minutes":14,"objectives":["Explain double-hull tanker geometry","Recognize the purpose of cofferdams and cargo boundaries"],"overview":"Double-hull tankers have an outer hull separated from the cargo tank boundary by wing and bottom spaces. This arrangement is intended to provide an additional layer between cargo and the sea in specified damage circumstances.","details":["Longitudinal bulkheads and tank subdivision influence structural support, sloshing loads and cargo/ballast operations. Double-hull spaces may be ballast tanks or voids depending on arrangement.","A cofferdam is a separation space between certain tanks or spaces where segregation is needed. It must not be assumed safe for entry simply because it is nominally empty.","Tanker cargo spaces and associated systems introduce hazardous atmospheres and strict entry, cleaning, electrical and hot-work controls. Ship-specific arrangements govern all work."],"principle":"Tank boundaries form both protective barriers and load-carrying elements; damage to a member can affect integrity beyond the immediately visible space.","aboard":"Engine-room personnel should understand the location of fuel and ballast boundaries and avoid unintended connections across segregated systems.","defects":"Corrosion, coating disbondment, leakage between spaces and cracked connection brackets are important concerns.","inspection":"Observe atmosphere testing, permit-to-work and tanker-specific procedures; consult approved general arrangement and tank plans.","terms":["Double hull","Cofferdam","Wing tank","Longitudinal bulkhead","Segregation"],"summary":"Tank boundaries provide structural and containment functions. Always verify actual arrangements from ship drawings."},{"id":"engine-foundations","module":9,"title":"Main Engine Foundations & Chocks","minutes":16,"objectives":["Trace main engine load transfer to the hull","Explain foundation seating, chocks and holding-down bolts"],"overview":"A large marine diesel engine is seated on an engineered supporting structure built into the engine-room double bottom. Bedplate loads pass through chocks or seating arrangements and foundation structure into girders, floors and the rest of the hull.","details":["Holding-down bolts and fitted bolts restrain the engine as intended by the machinery design; chocks provide controlled support and alignment. Different installations use steel or approved resin chocks.","The thrust bearing transmits propeller thrust into hull structure through the shafting foundation arrangement, either integrated with the engine or a separate thrust block.","Engine alignment can be affected by hull deflection, temperature, foundation condition and improper bolt tension. Maintenance follows maker procedures and ship alignment records."],"principle":"Foundations must sustain static weight, alternating machinery forces, torque reactions and thrust-related loads without losing alignment.","aboard":"A Fourth Engineer may assist with foundation inspections, holding-down bolt checks and recording unusual vibration or fretting around machinery seatings.","defects":"Loose bolts, cracked chocks, fretting, foundation weld cracks and abnormal vibration are warning signs requiring engineering assessment.","inspection":"Visual checks and specified tension/alignment checks should be planned under responsible engineers and manufacturer guidance.","terms":["Bedplate","Foundation girder","Chock","Holding-down bolt","Fretting","Thrust block"],"summary":"An engine foundation is part of the hull load path, not simply a concrete-like pedestal beneath the engine."},{"id":"sea-chests-bilge","module":9,"title":"Sea Chests, Bilge Wells & Stern Structure","minutes":14,"objectives":["Understand why sea connections need careful structural integration","Locate bilge and stern-area construction features"],"overview":"Sea chests are recessed hull structures housing seawater intake openings, grating and associated valves/strainers. Bilge wells are low points where water can collect for controlled removal through the relevant bilge system.","details":["Sea inlet openings interrupt the shell and require appropriate reinforcement and valve arrangements. Ice, fouling and marine growth can impair seawater flow.","Stern tube and shaft support arrangements transfer shaft loads and maintain hull boundary integrity. They are integrated with stern frames and adjacent structure.","Bilge wells are designed with access, drainage and filtering arrangements appropriate to machinery spaces. Bilge systems have pollution-prevention controls; discharges must follow approved requirements."],"principle":"Openings and penetrations must preserve structural support and watertight integrity while allowing machinery services.","aboard":"Engine cadets should trace sea chest suction routes, identify bilge wells, and understand alarms and safe isolation of sea connections.","defects":"Localized leakage, wasted inlet grating attachments, blocked strainers and cracked penetrations may indicate safety or machinery risks.","inspection":"Follow valve identification, isolation and permit procedures. Do not work on sea-connected piping without confirmed safe isolation.","terms":["Sea chest","Grating","Bilge well","Stern tube","Shell penetration"],"summary":"Engine-room construction connects ship structure directly with cooling, bilge and propulsion systems."},{"id":"survey-corrosion","module":10,"title":"Structural Surveys, Corrosion & Repairs","minutes":16,"objectives":["Distinguish general wastage, pitting and grooving","Understand the roles of surveyors, ship staff and approved procedures"],"overview":"Ships are inspected under applicable statutory, class and owner programs. Corrosion, cracks, deformation and coating condition are assessed using visual examinations and, where required, thickness measurements and specialist methods.","details":["General corrosion reduces average plate thickness; pitting creates local metal loss; grooving concentrates loss along narrow areas such as joints. Accurate measurements and approved criteria determine severity.","Classification surveyors assess compliance with class rules. Statutory surveys relate to flag-state obligations and internationally adopted conventions. Some activities are delegated to recognized organizations.","Structural repairs need approved specifications, material grades, welding procedures, work permits and verification. Simply welding over a crack or installing an ad hoc doubler may be unsafe or unacceptable."],"principle":"Structural integrity depends on adequate residual thickness, sound joints, suitable materials and proper load paths.","aboard":"An engine cadet reporting a crack at an engine foundation should give precise location, size estimate, conditions and observations to the responsible engineer.","defects":"Undetected corrosion, recurring cracks and unapproved modifications can reduce load-carrying capacity or compromise boundaries.","inspection":"Participate only in approved inspections. Enclosed-space entry, work at height, gas testing and permits require full compliance.","terms":["Thickness measurement","Pitting","Grooving","Survey","Classification","Repair specification"],"summary":"Identify, document, escalate and verify—never treat an observed structural defect as something to conceal or patch casually."},{"id":"solas-load-lines","module":10,"title":"SOLAS, Load Lines & Structural Rules","minutes":14,"objectives":["Differentiate IMO conventions from classification rules","Know which official references to consult"],"overview":"SOLAS Chapter II-1 addresses ship construction, subdivision and stability, machinery and electrical installations. The International Convention on Load Lines establishes a framework for freeboard and other associated safety requirements. Class rules provide detailed structural standards applicable to the vessel.","details":["IMO conventions are adopted internationally and implemented by flag Administrations; exact applicable requirements depend on ship type, age, dimensions, exemptions, amendments and flag requirements.","The IACS Common Structural Rules (CSR) cover the design and structural requirements of applicable bulk carriers and oil tankers. Approval and survey details must be taken from the relevant classification society.","Load line marks indicate authorized seasonal and regional loading limits in the applicable regime. Hatchways, doors and other fittings contribute to load-line conditions of assignment."],"principle":"International rules establish mandatory safety frameworks; class technical rules implement detailed ship construction requirements for classed ships.","aboard":"A junior engineer should know where the ship’s class certificates, load line certificate, drawings and approved operating manuals can be found.","defects":"Assuming a single numerical rule applies to all ships, or using an outdated excerpt without amendment checks, is a compliance risk.","inspection":"Use current official IMO, flag-state and relevant class publications and the vessel’s certificate particulars. This app contains no class-approved scantling criteria.","terms":["SOLAS","Load Lines","IACS","CSR","Flag State","Classification society"],"summary":"Use conventions for the international framework and current ship-specific flag and class documents for exact compliance decisions."}],"questions":[{"module":1,"q":"Which dimension measures a ship from its extreme forward end to its extreme aft end?","options":["Length overall (LOA)","Moulded breadth","Length between perpendiculars","Moulded depth"],"answer":0,"why":"LOA measures the overall extreme length; LBP uses defined perpendicular reference positions."},{"module":1,"q":"What is deadweight tonnage (DWT)?","options":["Lightship displacement only","Loaded displacement minus lightship displacement","Gross tonnage minus net tonnage","Cargo mass only"],"answer":1,"why":"DWT includes cargo and other variable load such as fuel, ballast and stores."},{"module":1,"q":"Gross tonnage (GT) is fundamentally a measure related to:","options":["Mass of cargo","Immersed volume of the hull","Volume of enclosed spaces","Propulsion power"],"answer":2,"why":"GT is a dimensionless regulatory measure derived from enclosed volume."},{"module":1,"q":"For a floating ship, its mass is equal to the:","options":["Mass of water displaced","Deadweight only","Gross tonnage","Weight of ballast only"],"answer":0,"why":"By Archimedes’ principle, the ship displaces water whose mass equals its mass."},{"module":1,"q":"Which dimension is vertical from the reference baseline to the waterline?","options":["Freeboard","Draught","Breadth","Depth to uppermost superstructure"],"answer":1,"why":"Draught refers to vertical immersion measured relative to the stated baseline."},{"module":1,"q":"A ship moves from salt water into fresh water without changing its weight. It generally:","options":["Rises higher","Keeps exactly the same draught","Sinks deeper","Loses deadweight capacity automatically"],"answer":2,"why":"Lower-density fresh water needs a larger displaced volume to support the same ship weight."},{"module":2,"q":"What is the tank top in many cargo ships?","options":["Outer bottom plating","Inner bottom plating","Upper deck plating","Collision bulkhead"],"answer":1,"why":"Tank top is another term for inner bottom plating, often the hold floor."},{"module":2,"q":"The centre girder generally runs:","options":["Transversely across cargo holds","Around the hatch opening","Longitudinally near the centreline","Only vertically through tanks"],"answer":2,"why":"The centre girder is a principal fore-and-aft bottom structural support."},{"module":2,"q":"What does a transverse floor primarily do in the double bottom?","options":["Provide deck drainage","Support inner/outer bottom and transfer loads across the bottom","Provide a hatch opening","Replace all longitudinal girders"],"answer":1,"why":"Floors link the bottom structure transversely and support its plating."},{"module":2,"q":"Shell plating is directly exposed to:","options":["Only cargo pressure","Sea pressure and external environment","Only machinery thrust","Only hatch-cover compression"],"answer":1,"why":"The shell is the external hull skin resisting seawater loading."},{"module":2,"q":"A collision bulkhead is primarily associated with:","options":["Protecting against bow-region flooding","Separating accommodation decks","Supporting the propeller shaft only","Preventing fuel ignition"],"answer":0,"why":"The forward collision bulkhead is a watertight subdivision intended to limit progressive flooding after bow damage."},{"module":2,"q":"Which detail often connects a stiffener to a larger member?","options":["Bilge strake","Bracket","Plimsoll mark","Sounding tape"],"answer":1,"why":"Brackets reinforce joints and provide a structural load path at connections."},{"module":3,"q":"Longitudinal framing uses closely spaced members that run:","options":["Port-to-starboard","Vertically only","Fore-and-aft","Diagonally only"],"answer":2,"why":"Longitudinal stiffeners run along the ship and help reinforce decks and bottom against hull bending."},{"module":3,"q":"Which is usually a deeper primary transverse support?","options":["Web frame","Painting stripe","Drain channel","Rudder stock"],"answer":0,"why":"Web frames are deep primary supports collecting loads from ordinary stiffeners."},{"module":3,"q":"Why combine transverse and longitudinal framing?","options":["To avoid all brackets","To suit different structural loads in different hull regions","To eliminate corrosion","To remove the need for bulkheads"],"answer":1,"why":"Structural arrangements are tailored to global and local loads rather than using one framing direction everywhere."},{"module":3,"q":"In hull structures, scantlings refer to:","options":["Crew complement","Member dimensions and thicknesses","Watertight doors only","Draft markings"],"answer":1,"why":"Scantlings are the specified sizes of structural elements."},{"module":3,"q":"Plate loads normally pass first to:","options":["Its stiffeners or direct supports","The bridge telegraph","The propeller","The accommodation ladder"],"answer":0,"why":"Stiffeners and plate supports collect local loads and convey them to primary structure."},{"module":3,"q":"A cracked bracket toe is concerning because it may:","options":["Reduce local connection effectiveness","Improve load distribution","Increase plate thickness","Stop all hull bending"],"answer":0,"why":"A crack at a critical connection can reduce effective load transfer and propagate."},{"module":4,"q":"In a hogging hull-girder condition, the deck is generally in:","options":["Tension","Compression","No stress","Pure hydrostatic pressure only"],"answer":0,"why":"Under a simple hogging beam model, the upper fibres are in tension and the bottom in compression."},{"module":4,"q":"In a sagging hull-girder condition, the bottom is generally in:","options":["Compression","Tension","No stress","Torsion only"],"answer":1,"why":"Sagging bends the middle downward and puts the lower hull-girder fibres into tension."},{"module":4,"q":"Why do hulls experience longitudinal bending?","options":["Only because propeller thrust rises","Weight and buoyancy vary along their length","Only because of engine vibration","Because the keel has no strength"],"answer":1,"why":"Different weight and buoyancy distributions create net loads, shear and bending moment."},{"module":4,"q":"What is panting?","options":["Cyclic shell flexing due to varying sea pressure","Propeller cavitation","A permanent hatch-coaming bend","Pure ship yaw"],"answer":0,"why":"Panting is repeated in-and-out movement of plating, especially near the bow."},{"module":4,"q":"Fatigue cracks are most closely associated with:","options":["Repeated stress cycles","Single cargo weighing only","A thicker coat of paint","Low ship speed alone"],"answer":0,"why":"Cyclic stresses can initiate and grow cracks, often around welds and geometric discontinuities."},{"module":4,"q":"Racking is best described as:","options":["Cross-section distortion","Hull rusting","Flooding from the bilge","Thrust transmission through a shaft"],"answer":0,"why":"Racking distorts the transverse section under lateral forces and motion."},{"module":5,"q":"Which statement is most accurate?","options":["Weathertight always means watertight under any pressure","Watertight and weathertight are distinct specified protections","Only hatch covers can be weathertight","Sealing has no effect on flooding"],"answer":1,"why":"The two terms refer to different required water-exclusion conditions."},{"module":5,"q":"Why is a damaged hatch-cover gasket important?","options":["It can compromise the intended weather seal","It changes propeller pitch","It reduces engine compression","It alters the assigned flag state"],"answer":0,"why":"Damaged seals may permit ingress even when a cover is closed."},{"module":5,"q":"A pipe passing through a watertight bulkhead should use:","options":["Any convenient gap","An approved arrangement preserving integrity","Open-ended flexible hose only","Unsealed welding slots"],"answer":1,"why":"Penetrations must preserve the boundary’s watertight performance as approved."},{"module":5,"q":"Freeing ports on exposed decks primarily:","options":["Discharge shipped water off deck","Increase engine thrust","Store cargo hold ballast","Replace hatch covers"],"answer":0,"why":"Freeing ports drain water from open deck areas."},{"module":5,"q":"A hatch coaming is:","options":["Raised boundary around hatch opening","A ship centreline girder","The stern tube seal","A bilge drain valve"],"answer":0,"why":"Coamings define and elevate the hatch edge and support closure arrangements."},{"module":5,"q":"If a watertight closure cannot be secured as required, the cadet should:","options":["Ignore it if the sea is calm","Report it through the ship’s procedures","Remove its gasket","Paint over the gap"],"answer":1,"why":"An integrity issue requires immediate reporting and safe action according to vessel procedures."},{"module":6,"q":"Where does the buoyant force act for a floating vessel?","options":["Centre of buoyancy","Centre of gravity only","Metacentre at every heel","Stern tube centre"],"answer":0,"why":"The resultant buoyancy force acts through the centroid of displaced underwater volume."},{"module":6,"q":"For simple initial transverse stability, GM is:","options":["KG + KM","KM − KG","KG × displacement","Draught − freeboard"],"answer":1,"why":"Metacentric height is the distance between G and M; with common baseline definitions GM = KM − KG."},{"module":6,"q":"A slack wide tank can reduce initial stability because:","options":["Liquid shifts toward the low side on heel","The density of seawater disappears","G stays exactly fixed at every angle","The tank becomes watertight"],"answer":0,"why":"Free-surface movement of liquid creates a destabilizing effect."},{"module":6,"q":"A positive initial GM proves the ship has adequate stability in all conditions.","options":["True","False","Only when lightship","Only when freshwater"],"answer":1,"why":"Positive GM alone is not enough; stability curves, damage cases and other criteria also matter."},{"module":6,"q":"Loading a high weight on a ship, all else equal, generally:","options":["Lowers KG","Raises KG","Eliminates free surface","Increases structural depth"],"answer":1,"why":"Added weight at a high vertical position tends to raise the combined centre of gravity."},{"module":6,"q":"Which must be considered during ballast transfers?","options":["Only pump rotational speed","Changing tank free surfaces and ship condition","Only paint color","Only cargo hold temperatures"],"answer":1,"why":"Transfer stages alter weight distributions and sometimes free-surface effects."},{"module":7,"q":"Topside tanks in a bulk carrier are usually located:","options":["High at the sides beside the cargo hold","At the propeller only","Below the keel","Only inside the engine crankcase"],"answer":0,"why":"Topside tanks form upper wing spaces adjacent to the cargo hold."},{"module":7,"q":"Hopper tanks usually have:","options":["Sloping cargo hold-side plating","No connection to ship structure","Only vertical deck openings","A shape identical to a propeller"],"answer":0,"why":"Sloping lower wing boundaries are a characteristic of hopper side tank arrangements."},{"module":7,"q":"Why is tank top plate support important during cargo operations?","options":["Heavy cargo loading stresses its plates and supports","It controls radar echo","It replaces fire detection","It eliminates cargo density limits"],"answer":0,"why":"Tank-top plating and supporting floors/girders carry cargo loads."},{"module":7,"q":"An engine cadet observes cargo hold frame corrosion. What is best?","options":["Record and report it to responsible officers","Chip it away without permission","Assume coating failure is irrelevant","Conceal it until dry dock"],"answer":0,"why":"Observed structural defects should be accurately documented and escalated."},{"module":7,"q":"Which defect represents very localized metal loss?","options":["Pitting corrosion","Uniform hydrostatic pressure","Intact coating","A correct sounding"],"answer":0,"why":"Pitting creates local cavities in a corroding metal surface."},{"module":7,"q":"What is a structural stool on a bulk carrier?","options":["Reinforced support at bulkhead/structure junction","A portable crew chair","A ballast pump seal","A propeller cap"],"answer":0,"why":"Structural stools provide connection and support, such as at transverse bulkheads."},{"module":8,"q":"Why is a double hull fitted on many tankers?","options":["To create separation between cargo and sea in damage conditions","To eliminate all maintenance","To increase fuel flash point","To remove all cargo boundaries"],"answer":0,"why":"Double hull construction adds a protective space between cargo tanks and outer shell."},{"module":8,"q":"A cofferdam is generally:","options":["A segregation space between specified adjacent compartments","A main engine crankpin","A navigational sensor","A hatch cover gasket"],"answer":0,"why":"Cofferdams provide separation; their atmosphere may still be hazardous."},{"module":8,"q":"Can an empty-looking tanker void space be entered without authorization?","options":["Yes, if it is dry","No, enclosed-space requirements still apply","Yes, if the hatch is open","Only when main engine is stopped"],"answer":1,"why":"Atmospheric hazards and enclosed-space controls apply even to apparently empty spaces."},{"module":8,"q":"A longitudinal bulkhead runs:","options":["Fore-and-aft","Only between port and starboard","Only diagonally across the deck","Only outside the shell"],"answer":0,"why":"Longitudinal bulkheads are oriented in the fore-and-aft direction."},{"module":8,"q":"Double-hull wing spaces may be:","options":["Ballast tanks or void spaces, depending on design","Always cargo oil tanks","Always machinery crankcases","Always potable water tanks"],"answer":0,"why":"Actual purpose varies by tanker arrangement and approved tank plans."},{"module":8,"q":"Tanker cargo and void space work must follow:","options":["Ship-specific permits and hazardous-atmosphere controls","Unofficial shortcuts","Only ordinary room ventilation","Only a visual inspection"],"answer":0,"why":"Hazardous atmospheres and cargo system risks require applicable safeguards."},{"module":9,"q":"Main engine bedplate load is transmitted into the hull through:","options":["Chocks, foundations, girders and floors","The bridge radar","Only the exhaust gas pipe","Only the deck handrail"],"answer":0,"why":"Engine foundation support transfers machine loads into the double-bottom and hull structure."},{"module":9,"q":"What is the purpose of a holding-down bolt?","options":["Restrain machinery on its seating as designed","Measure GT","Drain sea chest gratings","Operate the rudder stock"],"answer":0,"why":"Holding-down bolts secure the engine to its designed support arrangement."},{"module":9,"q":"Where is propeller thrust ultimately transmitted?","options":["Through thrust-bearing foundation into the hull","Only into cooling water","Only into electrical cable trays","Only into the ship horn"],"answer":0,"why":"Thrust loads travel via the thrust bearing and foundation to the hull."},{"module":9,"q":"A sea chest is associated with:","options":["Seawater intake openings and valves","Cargo hatch cleats only","Ship gyrocompass","Freshwater bunkering only"],"answer":0,"why":"Sea chests provide seawater connection structures in the hull."},{"module":9,"q":"Which issue can indicate a machinery foundation defect?","options":["Cracked chocks and fretting","Normal painted labels","A correctly closed access hatch","A legible tank plan"],"answer":0,"why":"Fretting, damaged chocks, cracks and loose bolts can show seating problems."},{"module":9,"q":"When inspecting a sea-connected valve or pipe, priority is:","options":["Confirmed safe isolation and approved procedures","Simply opening any flange","Increasing bilge pump rate","Starting the main engine"],"answer":0,"why":"Uncontrolled sea entry is a flooding risk; sea connections require reliable isolation."},{"module":10,"q":"SOLAS Chapter II-1 primarily covers:","options":["Subdivision, stability, machinery and electrical construction requirements","Medical locker inventory only","Ship registry fees only","Navigation lights exclusively"],"answer":0,"why":"SOLAS II-1 covers construction, subdivision/stability and machinery/electrical safety."},{"module":10,"q":"IACS Common Structural Rules are associated with:","options":["Applicable bulk carriers and oil tankers","Only fishing nets","Helicopter flight plans","Only yacht decoration"],"answer":0,"why":"The IACS CSR govern structural requirements for applicable bulk carriers and oil tankers."},{"module":10,"q":"Which document is important for a ship’s assigned freeboard?","options":["International Load Line Certificate","Engine maker brochure only","Daily weather email","Cargo tally sheet alone"],"answer":0,"why":"Assigned freeboards and load lines are connected to the ship’s load-line certification."},{"module":10,"q":"A crack near a machinery foundation should first be:","options":["Reported with location and observations","Welded without approval","Hidden with grease","Covered by rubber packing"],"answer":0,"why":"Defects require reporting and assessment under the ship’s approved inspection and repair processes."},{"module":10,"q":"Exact rule requirements should be checked against:","options":["Current applicable flag/class rules and ship certificates","An unverified social-media post","A random sister ship’s dimensions","A generic online diagram alone"],"answer":0,"why":"Requirements vary with ship particulars and the applicable official rule edition."},{"module":10,"q":"A tank inspection may require:","options":["An enclosed-space entry permit and atmospheric precautions","Only ordinary shoes","No communication with ship staff","Always an unaccompanied cadet"],"answer":0,"why":"Enclosed-space entry and related safety controls are essential for tank inspections."}],"parts":[{"id":"deck","name":"Strength Deck","loc":"Top continuous hull deck around the cargo opening","purpose":"Carries longitudinal hull-girder loads and provides a structural closure to the hull section.","inspect":"Look for fractures near hatch corners, corrosion and deformed supporting members.","lesson":"shell-bulkheads"},{"id":"shell","name":"Side Shell Plating","loc":"Outboard hull boundary along port and starboard sides","purpose":"Forms the external watertight skin and transfers sea pressure to internal supports.","inspect":"Look for dents, cracks, wastage and coating damage; follow approved close-up access.","lesson":"shell-bulkheads"},{"id":"topside","name":"Topside / Upper Wing Tank","loc":"Triangular space on each upper side of a bulk-carrier cargo hold","purpose":"Creates reinforced upper wing structure and often provides a ballast tank.","inspect":"Watch for internal coating loss, leakage and connection cracks.","lesson":"bulk-carrier-holds"},{"id":"hopper","name":"Hopper Side Tank","loc":"Sloping lower side boundary beside the cargo hold","purpose":"Supports cargo hold sides, assists cargo flow and often forms a ballast tank.","inspect":"Pay attention to sloping plating, brackets and lower hold intersections.","lesson":"bulk-carrier-holds"},{"id":"tanktop","name":"Tank Top / Inner Bottom","loc":"Horizontal bottom surface of the cargo hold","purpose":"Supports cargo loading and forms the upper boundary of the double bottom.","inspect":"Check for impact dents, coating loss, cracked welds and leakage.","lesson":"keel-double-bottom"},{"id":"double","name":"Double Bottom Space","loc":"Structural cellular zone below tank top and above outer shell","purpose":"Provides structural strength and often houses tanks or void spaces.","inspect":"Enclosed-space entry rules apply; check floors, girders, coating and leakage.","lesson":"keel-double-bottom"},{"id":"girder","name":"Centre Girder","loc":"Centreline longitudinal support within the double bottom","purpose":"Transfers bottom loading longitudinally and supports inner/outer bottom plating.","inspect":"Check web and connection regions for corrosion or fractures.","lesson":"keel-double-bottom"},{"id":"frame","name":"Web Frames & Stiffeners","loc":"Side structure supporting the shell and lower wing boundaries","purpose":"Transfer plating loads to primary structure and reinforce the hull section.","inspect":"Inspect bracket toes, end connections and frame feet.","lesson":"framing-arrangements"},{"id":"hatch","name":"Hatch Opening & Coaming","loc":"Upper central opening over cargo hold","purpose":"Provides cargo access while allowing hatch-cover closures to exclude weather.","inspect":"Check coaming alignment, seals, drainage and operating components.","lesson":"watertight"},{"id":"bilge","name":"Bilge Keel","loc":"External fin on the turn of the bilge, either side","purpose":"Provides hydrodynamic roll damping in waves.","inspect":"Examine attachment and deformation during authorized dry-dock inspection.","lesson":"shell-bulkheads"}],"glossary":[["Athwartship","Across the ship, from one side toward the other."],["Ballast tank","A compartment used to hold ballast water for draft, trim or stability control."],["Beam","A transverse structural member supporting deck plating."],["Bilge keel","External longitudinal fin fitted near the turn of bilge to help reduce rolling."],["Bilge well","A recessed collection point for bilge liquid."],["Block coefficient","Underwater volume divided by length × breadth × draft using consistent reference dimensions."],["Bracket","A strengthening connection piece joining structural members."],["Centre girder","Longitudinal girder located near the vessel centreline in bottom structure."],["Centre of buoyancy","Centroid of the immersed volume; the buoyant force acts through it."],["Centre of gravity","Effective point through which a body’s total weight acts."],["Chock","Engine seating element that supports bedplate and helps maintain alignment."],["Cofferdam","A separation compartment between spaces where segregation is required."],["Collision bulkhead","Forward watertight bulkhead positioned to limit flooding after bow damage."],["Deadweight","Loaded displacement minus lightship displacement, representing variable load capacity."],["Deck girder","Longitudinal or transverse primary supporting member under a deck."],["Displacement","Mass of displaced water equal to total mass of a floating ship."],["Double bottom","Space bounded by outer bottom and inner bottom plating."],["Draught","Vertical distance from the reference baseline to waterline."],["Fatigue","Damage accumulated due to repeated stress cycles."],["Floor","Transverse structural member within the double bottom."],["Free surface effect","Reduction in initial stability caused by transverse movement of slack liquid."],["Freeboard","Vertical distance between specified deck line reference and assigned load line."],["Frame","Member supporting shell plating, often transverse."],["Girder","Primary supporting member carrying loads from plating and stiffeners."],["GM","Metacentric height; KM minus KG for the simplified initial stability case."],["Gross tonnage","Dimensionless volume-based regulatory measure."],["Hatch coaming","Raised boundary at the edge of a hatch opening."],["Hogging","Hull bending with the middle relatively higher than the ends."],["Hopper tank","Lower side wing tank/space with a sloped inner boundary on many bulk carriers."],["Hull girder","Whole hull considered as a beam resisting longitudinal loads."],["Keel","Principal bottom centreline structural feature, with form varying by hull design."],["KG","Vertical position of centre of gravity above the chosen keel/reference baseline."],["LBP","Length between the forward and aft perpendicular reference lines."],["LOA","Overall length between the extreme ends of a ship."],["Longitudinal stiffener","Fore-and-aft stiffener supporting plating and longitudinal strength."],["Moulded breadth","Breadth measured to specified moulded structural lines, typically excluding shell thickness."],["Metacentre","Geometric reference point used in small-angle initial stability."],["Panting","Cyclic in-and-out deformation of shell plating under varying sea pressure."],["Pitting","Localized corrosion forming small cavities in metal."],["Pounding","Impact of hull structure against water, especially during slamming."],["Racking","Transverse distortion of a hull cross-section."],["Sagging","Hull bending with the middle relatively lower than the ends."],["Scantlings","Dimensions and thicknesses of structural members."],["Sea chest","Recessed sea inlet structure supplying seawater to onboard systems."],["Shell plating","Outer steel plating forming the ship hull boundary."],["Stiffener","Structural member preventing excessive deformation of plating."],["Stringer","Longitudinal supporting member along deck or shell/bulkhead."],["Tank top","Inner bottom plating, often forming a cargo hold floor."],["Topside tank","Upper side/wing compartment adjacent to upper cargo hold on many bulk carriers."],["Torsion","Twisting of a structure about an axis."],["Transverse bulkhead","Bulkhead spanning generally across the ship."],["Watertight","Designed to prevent water passage under a specified pressure/condition."],["Weathertight","Designed to exclude water under specified sea and weather conditions."],["Web frame","Deep primary frame carrying loads from ordinary stiffeners."],["Wastage","Loss of material thickness through corrosion or other deterioration."]],"scenarios":[{"id":"corrosion","label":"Cargo hold corrosion","tag":"Structural inspection","difficulty":"Intermediate","intro":"During an authorized cargo hold inspection, coating has failed and deep rust is seen around several side frames and bracket toes near the hopper.","steps":[{"q":"What is your most appropriate first action?","choices":["Chip away the affected brackets immediately","Record the location and report it to the responsible officer","Ignore it unless the hold is flooding"],"answer":1,"why":"Good documentation and prompt reporting allow the responsible personnel to plan appropriate measurement and survey."},{"q":"How should the extent of deterioration be established?","choices":["By visual color alone","By relevant thickness measurements and authorized structural assessment","By comparing it to the color of sound steel"],"answer":1,"why":"Remaining structural thickness and defect extent require the appropriate inspection and measurement methods."},{"q":"If significant wastage is confirmed, what is the correct principle?","choices":["Evaluate against approved rules and arrange authorized repairs","Weld a random plate over all damage","Leave it until the ship changes cargo"],"answer":0,"why":"Repair decisions follow class/flag requirements and approved specifications, not improvised reinforcement."}]},{"id":"flood","label":"Unexpected water ingress","tag":"Watertight integrity","difficulty":"Advanced","intro":"A machinery-space bilge alarm operates. The watchkeeper finds an unusual increase in bilge level near a bulkhead penetration.","steps":[{"q":"What should the cadet do?","choices":["Silence alarm and carry on","Inform the engineer on watch and follow emergency procedures","Open adjacent tank manholes to check"],"answer":1,"why":"Prompt reporting and the ship’s emergency response take precedence over informal investigation."},{"q":"What information is useful to the response team?","choices":["Exact location, ingress rate if observable and affected systems","Only the color of the bilge water","A guess about the last dry-dock date"],"answer":0,"why":"Accurate observations help assess risk and trace the ingress route."},{"q":"What should happen before isolating a sea-connected line?","choices":["Verify the line and follow approved safe isolation procedures","Loosen the flange to see which pipe leaks","Turn unrelated valves at random"],"answer":0,"why":"Incorrect manipulation of sea-connected lines can worsen flooding."}]},{"id":"crack","label":"Main engine foundation crack","tag":"Engine room structure","difficulty":"Advanced","intro":"An engine cadet notices a fine line and dark fretting marks at a bracket toe beside a main engine holding-down arrangement.","steps":[{"q":"Which observation matters?","choices":["Only the paint brand","Precise crack location, extent and any unusual vibration","Only the surrounding floor color"],"answer":1,"why":"Location, symptoms, extent and machinery behavior are vital for proper evaluation."},{"q":"Can the cadet assume it is a harmless paint crack?","choices":["Yes, because engines vibrate","No, inform the responsible engineer for assessment","Yes, if no oil leak is visible"],"answer":1,"why":"Foundation defects can impair alignment and structural load paths; assumptions are unsafe."},{"q":"Which repair approach is appropriate?","choices":["Ad hoc welding while running","Approved inspection, engineering assessment and repair procedure","Covering the line with thick grease"],"answer":1,"why":"Work on highly loaded structure requires an approved method and competent verification."}]},{"id":"hatch","label":"Hatch-cover leakage","tag":"Cargo protection","difficulty":"Intermediate","intro":"A bulk carrier hatch cover is closed but stains are found below the joint. The gasket shows localized damage and the drain channel contains debris.","steps":[{"q":"Which issue requires attention?","choices":["Only cosmetic paint","Gasket condition, compression arrangement and drainage","Only the ship’s cargo logo"],"answer":1,"why":"All three affect the closure’s intended weather seal."},{"q":"What is the safe action?","choices":["Report defects and arrange maintenance under ship procedures","Over-tighten every cleat without checking instructions","Block the drain with sealant"],"answer":0,"why":"Correct maintenance needs appropriate inspection and maker/ship guidance."},{"q":"After repairs, how is acceptability established?","choices":["Through approved examination/testing according to requirements","By making the surface look shiny","By using only a tape measure at one point"],"answer":0,"why":"Fit and sealing effectiveness should be confirmed by applicable approved procedures."}]}]}</script><script>
const D=JSON.parse(document.getElementById('content').textContent);
const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const KEY='shipstruct-academy-progress-v1';let state;try{state=JSON.parse(localStorage.getItem(KEY))||{}}catch{state={}};if(!Array.isArray(state.completed))state.completed=[];if(!Array.isArray(state.history))state.history=[];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}};
let selectedPart='tanktop',quiz=null,inspection=null;
const M=id=>D.modules.find(m=>m.id===+id),L=id=>D.lessons.find(l=>l.id===id),P=id=>D.parts.find(p=>p.id===id),S=id=>D.scenarios.find(s=>s.id===id);
const stext=(text)=>esc(text||'');
const btn=(label,action,other='')=>`<button class="btn ${other}" data-action="${action}">${label}</button>`;
const heading=(k,h,p)=>`<div class="ey">${k}</div><h1>${h}</h1><p class="intro">${p}</p>`;
const footer=`<p class="disclaimer">Independent study aid. Illustrations are schematic; training does not replace approved vessel plans, shipboard procedures or applicable flag/class rules. Saved progress remains in this browser.</p>`;
function route(){return decodeURIComponent(location.hash.slice(1)||'home')}
function home(){let n=state.completed.length;return `<div class="hero">${heading('LEARN · PRACTISE · REVISE','ShipStruct Academy','A quick-loading ship construction learning platform for engine cadets. Study ship structures, practise questions and inspect a bulk carrier cross-section.')}<div class="stats"><span class="chip"><b>10</b> modules</span><span class="chip"><b>${D.lessons.length}</b> lessons</span><span class="chip"><b>${D.questions.length}</b> questions</span></div><a class="btn" href="#module/1">Start studying →</a> <a class="btn alt" href="classroom.html">Classroom & live quizzes →</a></div><h2 class="section">Learning modules</h2><div class="grid">${D.modules.map(m=>`<a href="#module/${m.id}" class="tile"><span class="num">MODULE ${String(m.id).padStart(2,'0')}</span><h3>${esc(m.title)}</h3><p>${esc(m.subtitle)}</p><small>${D.lessons.filter(l=>l.module===m.id).length} lessons</small></a>`).join('')}</div><h2 class="section">Your progress</h2><div class="card"><b>${n} of ${D.lessons.length} lessons completed</b><div class="bar"><div class="fill" style="width:${Math.min(100,Math.round(100*n/D.lessons.length))}%"></div></div>${btn('Practice 10 questions','startQuiz')} <a href="#progress" class="btn alt">My progress →</a></div>`}
function modulePage(id){const m=M(id);if(!m)return home();const lessons=D.lessons.filter(l=>l.module===m.id);return `<a class="back" href="#home">← All modules</a>${heading('MODULE '+m.id,esc(m.title),esc(m.subtitle))}<div class="list">${lessons.map(l=>`<a href="#lesson/${l.id}" class="tile"><span class="num">${state.completed.includes(l.id)?'✓ COMPLETED':'LESSON'} · ${l.minutes} MIN</span><h3>${esc(l.title)}</h3><p>${esc(l.overview.slice(0,155))}…</p></a>`).join('')}</div>`}
function lessonPage(id){const l=L(id);if(!l)return home();let next=D.lessons[(D.lessons.indexOf(l)+1)%D.lessons.length];return `<a class="back" href="#module/${l.module}">← ${esc(M(l.module).title)}</a>${heading('LESSON · '+l.minutes+' MIN',esc(l.title),esc(l.overview))}<article class="card lesson"><h2>Learning objectives</h2><ul>${l.objectives.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>Technical explanation</h2>${l.details.map(x=>`<p>${esc(x)}</p>`).join('')}<h2>Engineering principle</h2><p>${esc(l.principle)}</p><h2>Onboard application</h2><p>${esc(l.aboard)}</p><h2>Common defects & errors</h2><p>${esc(l.defects)}</p><h2>Inspection focus</h2><p>${esc(l.inspection)}</p><h2>Terminology</h2><p>${l.terms.map(x=>`<span class="chip">${esc(x)}</span>`).join(' ')}</p><h2>Revision summary</h2><div class="note">${esc(l.summary)}</div><div class="flex">${btn(state.completed.includes(l.id)?'✓ Completed — undo':'Mark lesson completed','complete','')} <a class="btn alt" href="#lesson/${next.id}">Next lesson →</a></div></article>`}
function quizPage(){if(!quiz)return `${heading('EXAMINATION CENTRE','Practice quiz','10 random single-answer questions with instant explanations and locally saved results.')}<div class="card">${btn('Start 10-question quiz','startQuiz')}</div>`;if(quiz.done){const score=Math.round(quiz.correct*100/quiz.items.length);return `${heading('EXAMINATION RESULT','Session completed','Review your achievement and continue your revision.')}<div class="card"><div class="score">${score}%</div><p>${quiz.correct} of ${quiz.items.length} questions correct</p>${btn('Take another quiz','startQuiz')} <a class="btn alt" href="#home">Home</a></div>`}
const q=quiz.items[quiz.i];const answered=quiz.choice!==null;return `<div class="ey">QUESTION ${quiz.i+1} / ${quiz.items.length}</div><div class="bar"><div class="fill" style="width:${100*quiz.i/quiz.items.length}%"></div></div><div class="card"><h2>${esc(q.q)}</h2>${q.options.map((o,i)=>`<button ${answered?'disabled':''} class="answer ${answered&&i===quiz.choice?'selected':''} ${answered&&i===q.answer?'good':''}" data-action="choose" data-value="${i}">${String.fromCharCode(65+i)}. ${esc(o)}</button>`).join('')}${answered?`<div class="result"><strong>${quiz.choice===q.answer?'✓ Correct':'✕ Not quite'}</strong><p>${esc(q.why)}</p></div>${btn(quiz.i===quiz.items.length-1?'Finish quiz':'Next question →','nextQuiz')}`:''}</div>`}
function explorer(){let p=P(selectedPart)||D.parts[0];return `${heading('INTERACTIVE HULL DIAGRAM','Bulk carrier cross-section','Tap a structural component to see what it does and what to inspect onboard. Schematic and not to scale.')}<div class="card"><svg class="ship" viewBox="0 0 640 375" role="img" aria-label="Interactive bulk carrier cross-section"><path d="M65 75 L90 265 Q120 334 225 338 H415 Q520 334 550 265 L575 75" stroke="#7fd3de" stroke-width="12" fill="#15384b"/><path data-part="deck" d="M65 75H232V110H408V75H575" fill="none" stroke="#b3e0e1" stroke-width="12"/><path data-part="hatch" d="M225 75H415V109H225Z" fill="#4b91a5" stroke="#f5bd6d" stroke-width="4"/><path data-part="topside" d="M75 90H172L104 175Z M565 90H468L536 175Z" fill="#305a6c" stroke="#48d4c3" stroke-width="3"/><path data-part="hopper" d="M95 266L172 266L172 198Z M545 266L468 266L468 198Z" fill="#335f72" stroke="#f5bd6d" stroke-width="3"/><path data-part="tanktop" d="M172 266H468" stroke="#83e4da" stroke-width="9"/><path data-part="double" d="M172 272H468V332H172Z" fill="#204b5b" stroke="#6ab6c3" stroke-width="3"/><path data-part="girder" d="M320 271V330" stroke="#f3cf87" stroke-width="7"/><path data-part="frame" d="M118 120V263 M522 120V263" stroke="#5adbe0" stroke-width="6"/><path data-part="shell" d="M65 75L90 265Q120 334 225 338H415Q520 334 550 265L575 75" stroke="#8fd7e7" stroke-width="12" fill="none" opacity=".55"/><path data-part="bilge" d="M90 265 Q120 334 225 338 M415 338Q520 334 550 265" stroke="#f3ae70" stroke-width="6" fill="none"/><text x="320" y="185" fill="#d8f6f2" text-anchor="middle" font-size="19" font-weight="700">CARGO HOLD</text><text x="320" y="308" fill="#b5dfdf" font-size="12" text-anchor="middle">DOUBLE BOTTOM</text><text x="320" y="35" fill="#8fe7dc" font-size="13" text-anchor="middle">TAP COLORED MEMBERS</text></svg><div class="tools">${D.parts.map(p=>`<button class="btn ${selectedPart===p.id?'':'alt'}" data-action="part" data-value="${p.id}">${esc(p.name)}</button>`).join('')}</div><div class="note"><h3>${esc(p.name)}</h3><p>${esc(p.loc)}</p><strong>Purpose:</strong><p>${esc(p.purpose)}</p><strong>Inspection:</strong><p>${esc(p.inspect)}</p><a class="back" href="#lesson/${p.lesson}">Study related lesson →</a></div></div>`}
function inspections(){return `${heading('PRACTICAL INSPECTION','Virtual inspection lab','Practise recognition and reporting decisions in shipboard scenarios.')}<div class="grid">${D.scenarios.map(s=>`<div class="tile"><span class="num">${esc(s.difficulty)}</span><h3>${esc(s.label)}</h3><p>${esc(s.intro)}</p><div class="section"> <button class="btn" data-action="startInspection" data-value="${s.id}">Start scenario →</button></div></div>`).join('')}</div>`}
function inspectionPage(){if(!inspection)return inspections();const s=S(inspection.id);if(inspection.i>=s.steps.length){return `${heading('SCENARIO COMPLETE',esc(s.label),'Practice outcome') }<div class="card"><div class="score">${Math.round(100*inspection.correct/s.steps.length)}%</div><p>${inspection.correct} out of ${s.steps.length} decisions matched the recommended response.</p>${btn('Another scenario','inspectionExit')}</div>`}
const step=s.steps[inspection.i],answered=inspection.choice!==null;return `<div class="ey">${esc(s.label)} · STEP ${inspection.i+1}/${s.steps.length}</div><div class="card"><h2>${esc(step.q)}</h2>${step.choices.map((x,i)=>`<button data-action="inspectionChoose" data-value="${i}" class="answer ${answered&&i===step.answer?'good':''} ${answered&&inspection.choice===i?'selected':''}" ${answered?'disabled':''}>${esc(x)}</button>`).join('')}${answered?`<div class="result">${inspection.choice===step.answer?'✓ Appropriate decision':'Consider the safer response'}<p>${esc(step.why)}</p></div>${btn('Continue →','inspectionNext')}`:''}</div>`}
function calcPage(){return `${heading('NAVAL ARCHITECTURE','Quick calculators','Simple educational calculations; verify inputs against approved ship particulars.')}<div class="card"><h2>Block coefficient (Cb)</h2><p>Cb = underwater volume / (L × B × T)</p><div class="tools"><label>Underwater volume (m³)<br><input id="vol" type="number" min="0.001" step="any" value="70000"></label><label>Length (m)<br><input id="len" type="number" min="0.001" step="any" value="200"></label><label>Breadth (m)<br><input id="beam" type="number" min="0.001" step="any" value="32"></label><label>Draught (m)<br><input id="draft" type="number" min="0.001" step="any" value="12"></label></div>${btn('Calculate coefficient','calc')}<div class="result" id="calcResult">Enter vessel dimensions and calculate.</div><small>Uses compatible reference dimensions and displacement volume, not displacement mass. It is a simplified teaching calculation.</small></div>`}
function progressPage(){let n=state.completed.length,h=state.history;return `${heading('LEARNING TRACKER','Your progress','Saved locally in the browser you are using.')}<div class="grid"><div class="card"><h3>Lessons completed</h3><div class="score">${n}/${D.lessons.length}</div></div><div class="card"><h3>Quiz attempts</h3><div class="score">${h.length}</div></div><div class="card"><h3>Most recent score</h3><div class="score">${h.length?h[h.length-1].score+'%':'—'}</div></div></div><h2 class="section">Completed lessons</h2><div class="list">${n?state.completed.map(id=>L(id)?`<a class="tile" href="#lesson/${id}">✓ ${esc(L(id).title)}</a>`:'').join(''):'<div class="card">Your completed lessons will appear here.</div>'}</div>`}
function glossaryPage(){return `${heading('REFERENCE GLOSSARY','Marine terminology','Key words used in ship construction and structural engineering.')}<div class="card"><div class="tools"><input id="search" type="search" placeholder="Search terms" aria-label="Search terms"></div><div id="terms">${D.glossary.map(([word,desc])=>`<div class="term" data-term="${esc((word+' '+desc).toLowerCase())}"><strong>${esc(word)}</strong>${esc(desc)}</div>`).join('')}</div></div>`}
function render(){let r=route(),out=r==='home'?home():r.startsWith('module/')?modulePage(r.slice(7)):r.startsWith('lesson/')?lessonPage(r.slice(7)):r==='quiz'?quizPage():r==='explorer'?explorer():r==='inspections'?inspectionPage():r==='calculators'?calcPage():r==='progress'?progressPage():r==='glossary'?glossaryPage():home();$('#app').innerHTML=out+footer;document.querySelectorAll('.tabbar a').forEach(a=>a.classList.toggle('on',a.hash==='#'+r));}
function runAction(a,target){let v=target.dataset.value;if(a==='complete'){let id=route().slice(7);state.completed=state.completed.includes(id)?state.completed.filter(x=>x!==id):[...state.completed,id];save();render()}else if(a==='startQuiz'){const items=[...D.questions].sort(()=>Math.random()-.5).slice(0,10);quiz={items,i:0,choice:null,correct:0,done:false};location.hash='#quiz';render()}else if(a==='choose'&&quiz&&quiz.choice===null){quiz.choice=+v;if(quiz.choice===quiz.items[quiz.i].answer)quiz.correct++;render()}else if(a==='nextQuiz'){quiz.i++;quiz.choice=null;if(quiz.i>=quiz.items.length){quiz.done=true;state.history.push({date:new Date().toISOString(),score:Math.round(100*quiz.correct/quiz.items.length),correct:quiz.correct,total:quiz.items.length,topic:'All topics',mode:'Fast practice'});save()}render()}else if(a==='part'){selectedPart=v;render()}else if(a==='startInspection'){inspection={id:v,i:0,choice:null,correct:0};location.hash='#inspections';render()}else if(a==='inspectionChoose'&&inspection&&inspection.choice===null){inspection.choice=+v;if(+v===S(inspection.id).steps[inspection.i].answer)inspection.correct++;render()}else if(a==='inspectionNext'){inspection.i++;inspection.choice=null;render()}else if(a==='inspectionExit'){inspection=null;render()}else if(a==='calc'){let values=['vol','len','beam','draft'].map(id=>Number($('#'+id).value));$('#calcResult').textContent=values.every(Number.isFinite)&&values.every(x=>x>0)?`Calculated Cb = ${(values[0]/(values[1]*values[2]*values[3])).toFixed(4)} (dimensionless). Check this is physically meaningful for the hull.`:'All inputs must be positive numbers.'}}
document.addEventListener('click',e=>{let el=e.target.closest('[data-action]');if(el)runAction(el.dataset.action,el);let part=e.target.closest('[data-part]');if(part){selectedPart=part.dataset.part;render()}});
document.addEventListener('input',e=>{if(e.target.id==='search'){let q=e.target.value.toLowerCase();document.querySelectorAll('[data-term]').forEach(x=>x.hidden=!x.dataset.term.includes(q))}});
window.addEventListener('hashchange',()=>{inspection=route()==='inspections'?inspection:null;render();scrollTo(0,0)});
render();
</script></body></html>
